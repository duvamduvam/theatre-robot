# Banc PC « Didier à l'arrêt » (2026-09-13) : perception + parole RÉELLES sur
# le PC de dev (webcam USB + carte son), corps SIMULÉ dans Gazebo
# (dadou_robot_ros/conf/docker/sim). Créé pendant l'immobilisation du robot
# (Pi 4 fumé le 12/09, convertisseurs 24V→5V en commande) pour continuer à
# travailler la conversation et le suivi de personne sans matériel.
#
# MÊME CODE QUE LE PI 5 : le Dockerfile-arm est réutilisé TEL QUEL — sa base
# ros:jazzy-ros-base et toutes les dépendances pip existent en amd64, seul le
# tag d'image change. Aucun fichier dupliqué : ce qu'on valide ici est ce qui
# tournera sur le robot (règle du projet : la vérification exécute le même
# code que la prod).
#
# SÉCURITÉ : ROS_DOMAIN_ID=43 par défaut — domaine de la SIMULATION (le vrai
# robot est sur 42). Rien de ce qui part d'ici ne peut atteindre le vrai
# Didier, même allumé sur le même réseau.
#
# Usage (voir dadou_robot_ros/docs/operations.md §Banc PC) :
#   ./build-x86.sh                                        # 1re fois (long)
#   CHAT=true docker compose -f docker-compose-x86.yml up -d
#
# Pas de section build: ici — le build passe par ./build-x86.sh (contextes
# nommés des packages de packages/ passés en --build-context, voir le script).
services:
  dadou-vision-x86:
    container_name: dadou-vision-x86-container
    image: dadouuu/dadou-vision-x86:latest
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-43}
      # Nom du robot = namespace ROS ABSOLU de tous les nœuds (lot L1b) : /didier/…
      # par défaut. Robot, vision et télécommande d'un même Didier DOIVENT avoir le
      # même nom (sinon ils ne s'entendent plus) ; la CLI ros2 doit préfixer.
      - ROBOT_NAME=${ROBOT_NAME:-didier}
      # Racine des DONNÉES (conf/, medias/, db/ ; lot L1e-3d) lue par vision_config.py : le
      # code est le package src/didier_vision, les données restent sous src/vision/.
      - DIDIER_VISION_DATA_DIR=/home/ros2_ws/src/vision/
      # chat_node (micro → whisper → OpenRouter → piper) : OFF par défaut,
      # même prudence que sur le Pi (micro physique + budget LLM payant).
      # Activation explicite : CHAT=true docker compose ... up.
      - CHAT=${CHAT:-false}
      # Audio par PIPEWIRE et non par les cartes ALSA (le casque du banc est
      # en Bluetooth : aucune carte ALSA ne le représente, cf. asound-pc.conf).
      # La socket est celle de la session graphique de l'hôte, montée ci-dessous.
      - PULSE_SERVER=unix:/run/pulse/native
      # Facteur VAD du BANC (cf. vision_config.vad_config_from_env) : 6 pour le
      # micro du casque BT, dont le bruit de fond fluctue (mesuré le 22/10,
      # après l'atténuation d'asound-pc.conf : souffle 10-30 RMS par trames,
      # voix 400-3000). À 1,3 la VAD ne détectait jamais la fin de phrase ; à 3
      # (seuil ~30-40) elle déclenchait encore sur le souffle, partait 12 s
      # (max_utterance_ms) et noyait la vraie phrase -> STT ''. Vide = défaut
      # 1,3 du robot (à remettre si le ReSpeaker, au plancher stable, revient).
      - CHAT_VAD_FACTOR=${CHAT_VAD_FACTOR:-6}
      # Partenaire de scène que Didier CONNAÎT (cf. personas.PARTNER_TEMPLATE) :
      # le banc sert à répéter, la personne au casque est David — pas un
      # passant à découvrir. Jamais posé sur le Pi (en rue, Didier ne sait pas
      # qui parle). Vide = aucun partenaire.
      - CHAT_PARTENAIRE=${CHAT_PARTENAIRE:-David}
      # Modèle whisper du BANC (cf. vision_config.whisper_model_from_env) :
      # « small » — « base » confondait chien/chat (séance du 22/10) ; ~1,2 s
      # de STT pour 6 s de parole sur ce PC. Le Pi reste en « base ».
      - CHAT_WHISPER_MODEL=${CHAT_WHISPER_MODEL:-small}
      # Mouvement à la voix (lot I1, cf. vision_config.move_enabled_from_env) :
      # Didier peut demander « go »/« stop » au régisseur de la répétition
      # (rehearsal/chat_move). BANC DE RÉPÉTITION SEULEMENT, jamais sur le Pi.
      # 1/true/on/oui = actif, 0/false/off/non = coupé (CHAT_MOUVEMENT=false
      # docker compose ... up -d) ; toute autre valeur = refus au démarrage.
      - CHAT_MOUVEMENT=${CHAT_MOUVEMENT:-true}
      # Metteur en scène intérieur (étude dadou_robot_ros/docs/etude-niveaux-
      # reflexion.md) : lance reflection_node ET branche chat_node dessus
      # (tableau de situation, tours spontanés, clé "reflechir"). Coût LLM en
      # plus (~0,0003 $ par réflexion Haiku, une toutes les 4-20 s quand la
      # scène est engagée). Ne commande pas le corps : pas de garde de domaine.
      # CHAT_REFLEXION=false docker compose ... up -d pour le couper.
      - CHAT_REFLEXION=${CHAT_REFLEXION:-true}
      # Modèle LLM de la bouche (31/10, essai demandé par David) : vide = défaut
      # de config (Haiku 5.5) ; CHAT_LLM_MODEL=anthropic/claude-sonnet-5.5
      # docker compose ... up -d pour l'essai Sonnet (liste fermée, cf.
      # vision_config.llm_model_from_env).
      - CHAT_LLM_MODEL=${CHAT_LLM_MODEL:-}
      # Source d'images à chaud de la perception (topic camera_source) : propose
      # la caméra du robot simulé (Gazebo, sensor_msgs/Image rgb8) en plus de la
      # webcam du PC, qui reste le défaut. BANC PC SEULEMENT : jamais posé dans
      # la config du Pi (vide = option indisponible). Vide pour la retirer.
      - VISION_SIM_CAMERA_TOPIC=${VISION_SIM_CAMERA_TOPIC:-camera/image_raw}
    network_mode: "host"
    # ipc host OBLIGATOIRE : FastDDS passe les DONNÉES en mémoire partagée
    # entre participants du même hôte (la découverte, elle, passe en UDP —
    # les topics se voient mais aucun message ne traverse, piège silencieux
    # constaté le 2026-09-13). Même réglage dans docker-compose-sim.yml côté
    # robot. Sans objet sur le parc réel : robot et vision sont deux Pi.
    ipc: "host"
    volumes:
      # Mêmes montages de sources que docker-compose-arm.yml (itération sans
      # rebuild ; conf/ apporte aussi conf/secret, jamais dans l'image).
      - ../../../conf:/home/ros2_ws/src/vision/conf
      # didier_vision (L1e-3d) : le code (module, package.xml, setup.py, launch/) est un
      # package de packages/, à plat dans src/ comme sur le parc.
      - ../../../../../packages/didier_vision:/home/ros2_ws/src/didier_vision
      # ⚠️ medias/ N'EST PAS monté, contrairement au compose ARM : sur le PC,
      # medias/voices/ n'existe pas dans le checkout et le bind-mount
      # MASQUERAIT la voix Piper téléchargée dans l'image au build
      # (ChatStartupError « voix Piper introuvable » — piège documenté dans
      # Dockerfile-arm). L'image se suffit.
      #
      # theatre_interfaces (StringTime) et theatre_contrats (contrat, importé par
      # le shim dadou_utils_ros/utils_static.py) : packages/ du mono-dépôt
      # (lot L1a, ../../../../../ = racine theatre-robot), même niveau src/ que
      # sur le parc. ⚠️ workspace/ persistant : après ce lot, `touch
      # packages/didier_vision/change` pour que colcon construise theatre_contrats, sinon les
      # nodes tombent à l'import.
      - ../../../../../packages/theatre_interfaces:/home/ros2_ws/src/theatre_interfaces
      - ../../../../../packages/theatre_contrats:/home/ros2_ws/src/theatre_contrats
      # dadou_utils_ros (L1e-3a) : lib partagée, package de packages/. ⚠️ workspace/
      # persistant : `touch packages/didier_vision/change` pour que colcon construise le nouveau package.
      - ../../../../../packages/dadou_utils_ros:/home/ros2_ws/src/dadou_utils_ros
      # Workspace colcon LOCAL au banc (pas le workspace partagé du Pi — sur
      # le PC les chemins ../../../../../ du compose ARM ne mènent nulle
      # part). Dossier gitignoré, jetable ; le premier démarrage build tout
      # seul (launch-ros-in-docker.sh build si install/ absent).
      - ./workspace/build:/home/ros2_ws/build
      - ./workspace/install:/home/ros2_ws/install
      - ./workspace/log:/home/ros2_ws/log
      # Alias ALSA casque_mic/mixette du BANC (mêmes noms que sur le Pi 5,
      # pointés sur la carte son du PC) : le code tourne sans changer un seul
      # paramètre. Fichier versionné ici, l'hôte n'est pas touché.
      - ./asound-pc.conf:/etc/asound.conf:ro
      # Socket PipeWire de la session hôte (uid 1000) : c'est par là que
      # passent micro ET sortie du casque Bluetooth. Chemin figé côté
      # conteneur (/run/pulse) pour que PULSE_SERVER ne dépende pas de l'uid.
      # ⚠️ La session graphique doit être ouverte : pas de PipeWire, pas de son
      # (un tour headless/cron n'aurait pas d'audio — sans objet ici, le banc
      # est une séance devant l'écran).
      - /run/user/1000/pulse:/run/pulse:ro
      # Webcam (/dev/video0, person_tracker) + audio (/dev/snd, chat) — même
      # pattern que le compose ARM.
      - /dev:/dev
    privileged: true

# /etc/asound.conf — Aliases PCM stables pour le robot Didier (Pi 5)
#
# Pourquoi ce fichier ?
# Les index USB (card 0, card 1...) changent selon l ordre de branchement.
# On cible les cartes PAR NOM (CARD=Array, CARD=Device...) pour garantir
# que les bons peripheriques sont toujours utilises, quel que soit l ordre.
#
# ⚠ Ce fichier est BIND-MONTE en lecture seule dans dadou-vision-container
# (/etc/asound.conf -> /etc/asound.conf). Un bind-mount de FICHIER suit
# l inode : ne jamais le modifier avec sed -i ni avec un editeur qui
# renomme (le conteneur continuerait a voir l ancien contenu jusqu au
# prochain redemarrage). Ecrire EN PLACE (tee, cat >) ou refaire un
# docker restart derriere.
#
# Trois cartes USB presentes (26/08) :
#   - reSpeaker XVF3800 4-Mic Array -> ALSA : Array   (micro de conversation)
#   - C-Media Unitek Y-247A         -> ALSA : Device  (sortie vers la mixette)
#   - Webcam USB PHY 2.0            -> ALSA : U20     (ancien micro, garde en secours)

# Alias mixette : sortie audio vers la mixette du spectacle
# Utiliser : aplay -D mixette fichier.wav
pcm.mixette {
    type plug
    slave.pcm "plughw:CARD=Device,DEV=0"
}

# Alias casque_mic : micro de CONVERSATION.
# Historique du nom : c etait le casque Logitech, puis la webcam (CARD=U20)
# du 11/07 au 26/08, et depuis le 26/08 le ReSpeaker XVF3800 (CARD=Array).
# Le NOM d alias ne bouge pas : vision_config.py::chat_mic_device le
# reference, et les tests unitaires de dadou_vision_ros l attendent tel quel.
# On change l esclave, jamais le nom.
#
# Le ReSpeaker ne sort QUE du S16_LE 16 kHz 2 canaux (un seul mode possible).
# Le plug fait la conversion si un appelant demande autre chose ; 16 kHz mono
# est de toute facon ce que Whisper veut.
# Utiliser : arecord -D casque_mic fichier.wav
pcm.casque_mic {
    type plug
    slave.pcm "plughw:CARD=Array,DEV=0"
}

# Alias webcam_mic : l ANCIEN micro (webcam), conserve pour la campagne D0.
# Sert a comparer les deux captations sur les memes enregistrements de rue
# plutot qu a se fier au ressenti. Ne pas cabler chat_node dessus.
pcm.webcam_mic {
    type plug
    slave.pcm "plughw:CARD=U20,DEV=0"
}

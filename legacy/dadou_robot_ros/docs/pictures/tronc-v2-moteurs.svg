<text x="1284.0" y="394.0" font-size="12.5" text-anchor="start" fill="#222">courroie 1:4 → axe X</text>
<text x="840.0" y="367.0" font-size="12.5" text-anchor="start" fill="#222">▲ plateau fixe : 4 ressorts</text>
<text x="840.0" y="382.0" font-size="12.5" text-anchor="start" fill="#222">de centrage (r130), butées ±17°</text>
<text x="1176.0" y="283.0" font-size="12.5" text-anchor="start" fill="#222">cardan</text>
<text x="790" y="560" font-size="14" font-weight="bold">Dimensionnement (hypothèses : 20 kg, CdG à 35 cm)</text>
<text x="790" y="584" font-size="14">• gravité : m·g·h = 69 N·m/rad (le buste veut tomber)</text>
<text x="790" y="608" font-size="14">• ressorts : 82 N·m/rad = ×1.2 → stable seul ; ~2.4 N/mm chacun à r130</text>
<text x="790" y="632" font-size="14">• à 15°, le moteur ne tient plus que 3.8 N·m</text>
<text x="790" y="656" font-size="14">• inertie ≈ 3.2 kg·m² → 20 rad/s² = 67 N·m de pointe à l'axe</text>
<text x="790" y="680" font-size="14">• courroie 1:4 → 17 N·m et 8.4 rad/s au moteur pour 120 °/s</text>
<text x="790" y="704" font-size="14" font-weight="bold">Moteurs candidats (lus le 25/10)</text>
<text x="790" y="728" font-size="14">• Unitree GO-M8010-6 : 23,7 N·m crête (marge ×1.4), 30 rad/s, 313,95 €</text>
<text x="790" y="752" font-size="14">• Robstride 03 : 60 N·m crête (large), A$509 — vitesse non lue</text>
<text x="790" y="776" font-size="14" font-weight="bold">Sécurité</text>
<text x="790" y="800" font-size="14">• coupure : les ressorts ramènent au centre (sans frein, sans logiciel)</text>
<text x="790" y="824" font-size="14">• choc : le moteur réversible cède au lieu de casser une vis</text>
<text x="790" y="848" font-size="14">• butées caoutchouc ±17° ; jupe anti-pincement sous le corps</text>
<text x="790" y="872" font-size="14" font-weight="bold">Ce que ça simplifie dans le concept</text>
<text x="790" y="896" font-size="14">• plus de vérins ni de colonne télescopique : 2 actionneurs au lieu de 3</text>
<text x="790" y="920" font-size="14">• l'enveloppe basse des bras (z≈672, imposée par les vérins) disparaît</text>

<text x="860" y="500" font-size="14" font-weight="bold">Pilotage : 3 vérins = 3 mouvements</text>
<text x="860" y="521" font-size="14">• hauteur : les 3 ensemble (±40 sur la colonne)</text>
<text x="860" y="542" font-size="14">• tangage : V0 contre V120 + V240</text>
<text x="860" y="563" font-size="14">• roulis : V120 contre V240</text>
<text x="860" y="584" font-size="14">Vérin : 24 V, course 100, 300 N à 40 mm/s,</text>
<text x="860" y="605" font-size="14">  potentiomètre 10 kΩ, autobloquant, IP65</text>
<text x="860" y="626" font-size="14">Au neutre : 279 mm (course 235 → 335)</text>
<text x="860" y="647" font-size="14">±15° : de 241 à 329 mm → reste ±6 mm</text>
<text x="860" y="668" font-size="14">±10° : de 252 à 311 mm → reste ±17 mm</text>
<text x="860" y="689" font-size="14">  (la marge sert à la hauteur ou à la respiration)</text>

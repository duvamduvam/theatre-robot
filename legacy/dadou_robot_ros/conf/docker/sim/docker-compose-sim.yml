# Simulation Gazebo sur le PC de dev.
#
# SÉCURITÉ : ROS_DOMAIN_ID=43 par défaut — domaine DÉDIÉ à la simulation
# (le vrai robot est sur 42). Aucune commande envoyée à la sim ne peut
# atteindre Didier, même allumé sur le même réseau. Pour piloter la sim
# avec la télécommande, lancer celle-ci avec ROS_DOMAIN_ID=43.
services:
  dadou-sim:
    container_name: dadou-sim-container
    image: dadouuu/dadou-sim-x86:latest
    build:
      context: ../../..
      dockerfile: conf/docker/sim/Dockerfile-sim
      # Packages COMMUNS du mono-dépôt theatre-robot (lot L1a) : hors du
      # contexte principal (racine de dadou_robot_ros), passés en contextes
      # NOMMÉS — `COPY --from=<nom>` dans le Dockerfile. Chemins relatifs à ce
      # fichier : ../../../../../ = racine du mono-dépôt.
      additional_contexts:
        theatre_interfaces: ../../../../../packages/theatre_interfaces
        theatre_contrats: ../../../../../packages/theatre_contrats
        # L1e-3a : la lib partagée n'est plus un dépôt frère mais un package de packages/.
        dadou_utils_ros: ../../../../../packages/dadou_utils_ros
        didier_jeu: ../../../../../packages/didier_jeu
        # L1e-1 : les packages ROS autonomes du robot ont déménagé de
        # conf/ du robot vers packages/ (même motif, noms inchangés).
        didier_description: ../../../../../packages/didier_description
        didier_sim: ../../../../../packages/didier_sim
        didier_drive: ../../../../../packages/didier_drive
        didier_web: ../../../../../packages/didier_web
        didier_rehearsal: ../../../../../packages/didier_rehearsal
        # L1e-3c : le cœur (ex-paquet robot) est un package de packages/.
        didier_core: ../../../../../packages/didier_core
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=${XAUTHORITY:-/tmp/.docker.xauth}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-43}
      # Nom du robot = namespace ROS ABSOLU de tous les nœuds (lot L1b) : /didier/…
      # par défaut. Robot, vision et télécommande d'un même Didier DOIVENT avoir le
      # même nom (sinon ils ne s'entendent plus) ; la CLI ros2 doit préfixer.
      - ROBOT_NAME=${ROBOT_NAME:-didier}
      # Racine des DONNÉES du cœur (json/, medias/), lue par didier_core/robot_config.py
      # (L1e-3c) : même chemin que sur le robot, montages plus bas.
      - DIDIER_DATA_DIR=/home/ros2_ws/src/robot/
      - HEADLESS=${HEADLESS:-false}
      # Monde Gazebo : fichier worlds/<WORLD>.sdf de didier_sim (`stage` = le
      # plateau nu historique, `rue` = la salle de répétition, étude
      # docs/etude-repetition-simulee.md §12, `chantiers` = des Nefs à la grue
      # Titan grise, 20 bugs + 30 lubies, §13). Le NOM interne du monde reste
      # `stage` dans les deux (contrat bridge LED), seul le fichier change.
      - WORLD=${WORLD:-stage}
      # animations_node (rejeu des séquences JSON, cf. commentaire des volumes
      # "didier_core" plus bas) : OFF par défaut, comme gaze_follower -- un lancement
      # explicite (ANIMATIONS=true docker compose ... up) est requis.
      - ANIMATIONS=${ANIMATIONS:-false}
      # web_bridge_node (pont HTTP/WebSocket W0, paquet didier_web) : même
      # prudence qu'ANIMATIONS -- OFF par défaut, activation explicite
      # (WEB=true docker compose ... up). http://localhost:8765 une fois lancé.
      # WEB_PORT : conteneur en réseau host, une collision avec un service du
      # PC de dev est vite arrivée (8088 était pris par Superset -- vécu).
      - WEB=${WEB:-false}
      - WEB_PORT=${WEB_PORT:-8765}
      # SÉCURITÉ (SIM-ONLY) : pilotage roues du pont web. OFF par défaut. Même
      # activé (WEB_DRIVE=true), la sim domain=43 ne peut PAS atteindre le vrai
      # Didier (domain 42) ; et il faut EN PLUS lancer la chaîne roues à la main
      # (drive.launch.py) dans le conteneur pour que cmd_vel_web bouge Gazebo
      # (voir operations.md). Rien de ce lot ne s'active sur le vrai robot.
      - WEB_DRIVE=${WEB_DRIVE:-false}
      # SÉCURITÉ (SIM-ONLY) : boutons de répétition de la page /scene du pont web
      # (route on/off/restart, vitesse, séance start/stop). OFF par défaut, même
      # prudence que WEB_DRIVE (REHEARSAL=true docker compose ... up). N'a aucun
      # effet sans WEB=true et ne LANCE rien : la route et le régisseur se lancent
      # à la main dans le conteneur. Le pont ignore de toute façon ce drapeau hors
      # du domaine 43 : la sim ne peut PAS commander le vrai Didier (domaine 42).
      - REHEARSAL=${REHEARSAL:-false}
      # face_sim (paquet "didier_core", aperçu web du visage LED -- les matrices LED
      # n'ont aucun rendu dans Gazebo) : même prudence qu'ANIMATIONS/WEB, OFF
      # par défaut. http://localhost:8766 une fois lancé (FACE=true).
      - FACE=${FACE:-false}
      - FACE_PORT=${FACE_PORT:-8766}
    network_mode: "host"
    # ipc host OBLIGATOIRE pour le banc PC (conteneur vision x86 sur la même
    # machine, 2026-09-13) : FastDDS fait la DÉCOUVERTE en UDP mais passe les
    # DONNÉES en mémoire partagée entre participants du même hôte — chaque
    # conteneur ayant son /dev/shm privé, les topics se voyaient (ros2 topic
    # list) mais aucun message ne traversait. Piège silencieux : sur le vrai
    # robot les deux Pi sont des machines distinctes, le cas ne s'y présente
    # jamais.
    ipc: "host"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/tmp/.docker.xauth}:${XAUTHORITY:-/tmp/.docker.xauth}:rw
      # Accès GPU pour le rendu de la GUI Gazebo (Intel/AMD).
      - /dev/dri:/dev/dri
      # Traces (08/11) : robot.log, journaux jeu/ et rehearsal/, tickets/ de la page scène.
      # Avant ce montage ils mouraient avec le conteneur (chaque `compose up` qui le
      # recrée). Même forme que le banc vision (./workspace/log), gitignoré (log/), lu par
      # conf/scripts/ramasser_traces.py. Le colcon de la sim y écrit aussi ses build_*.
      - ./workspace/log:/home/ros2_ws/log
      # Sources montées par-dessus la copie de l'image : itération sans rebuild.
      - ../../../../../packages/didier_description:/home/ros2_ws/src/didier_description
      - ../../../../../packages/didier_sim:/home/ros2_ws/src/didier_sim
      # Packages communs du mono-dépôt (lot L1a) : theatre_interfaces (copie
      # UNIQUE) et theatre_contrats (contrat, importé
      # par dadou_utils_ros/utils_static.py — sans lui, tout node tombe à l'import).
      - ../../../../../packages/theatre_interfaces:/home/ros2_ws/src/theatre_interfaces
      - ../../../../../packages/theatre_contrats:/home/ros2_ws/src/theatre_contrats
      # dadou_utils_ros (L1e-3a) : lib partagée, package à plat dans src/ (colcon la
      # construit ; plus de montage dans src/robot/).
      - ../../../../../packages/dadou_utils_ros:/home/ros2_ws/src/dadou_utils_ros
      # didier_jeu (lot A1, SIM-ONLY : refus hors domaine 43) : sélecteur de
      # jeu, lancé À LA MAIN (ros2 run didier_jeu jeu_node), cf. son README.
      - ../../../../../packages/didier_jeu:/home/ros2_ws/src/didier_jeu
      - ../../../../../packages/didier_drive:/home/ros2_ws/src/didier_drive
      - ../../../../../packages/didier_web:/home/ros2_ws/src/didier_web
      # didier_rehearsal : salle de répétition (SIM-ONLY, jamais dans le
      # bringup du robot) — cheminement de Didier dans la rue, lancé À LA
      # MAIN (rehearsal.launch.py), cf. son README.
      - ../../../../../packages/didier_rehearsal:/home/ros2_ws/src/didier_rehearsal
      - ../../scripts/launch-sim-in-docker.sh:/home/ros2_ws/launch-sim-in-docker.sh
      # V-R1 : protocole de vérification du cheminement (didier_rehearsal/README.md).
      - ../../scripts/validate-rehearsal-route.sh:/home/ros2_ws/validate-rehearsal-route.sh:ro
      - ../../scripts/validate-rehearsal-faults.sh:/home/ros2_ws/validate-rehearsal-faults.sh:ro
      # V-R3 : séance « chantiers » (monde chantiers, 20 bugs + 30 lubies), étude §13.8.
      - ../../scripts/validate-rehearsal-chantiers.sh:/home/ros2_ws/validate-rehearsal-chantiers.sh:ro
      # A1 : porte de sortie du sélecteur de jeu (T1-T7, spec A1 §6), 15 min.
      - ../../scripts/validate-jeu-a1.sh:/home/ros2_ws/validate-jeu-a1.sh:ro
      # L1b : preuve du namespace par robot (tout sous /<ROBOT_NAME>/ sauf les
      # 5 exceptions globales gravées), rejouable avec ROBOT_NAME=didier2 puis didier.
      - ../../scripts/validate-namespace.sh:/home/ros2_ws/validate-namespace.sh:ro
      # L1c : preuve que le robot publie catalogue + deploy_sha et que le catalogue
      # suit json/ (dépose puis supprime une séquence temporaire, nettoyée en sortant).
      - ../../scripts/validate-catalogue.sh:/home/ros2_ws/validate-catalogue.sh:ro
      # json/ : mêmes fichiers de séquences/couleurs LED que le vrai robot,
      # lus par leds_sim_node (params robot_lights_json/lights_base_json/colors_json).
      - ../../../json:/home/ros2_ws/json

      # --- Paquet "didier_core" (animations_node, face_sim ; ex-paquet "robot") ---
      # Depuis L1e-3c le CODE est un package de packages/, monté à plat dans src/
      # comme les autres ; src/robot/ ne porte plus que les DONNÉES (json/, medias/),
      # racine DIDIER_DATA_DIR ci-dessus — même disposition que sur le vrai robot
      # (rôle Ansible synchronise). Plus de montage de conf/ros2 (setup.py/package.xml
      # du paquet robot) en guise de src/robot/.
      - ../../../../../packages/didier_core:/home/ros2_ws/src/didier_core
      - ../../../json:/home/ros2_ws/src/robot/json
      # medias/ : PNG bouche/yeux lus par Face.load_visuals() (config[MOUTH_VISUALS_PATH]/
      # [EYE_VISUALS_PATH] = <PROJECT_DIRECTORY>/medias/visuals/{mouth,eye}, cf.
      # robot_config.py) -- requis par face_sim (param face:=true) : sans ce
      # volume, Face.load_visuals() lève FileNotFoundError au démarrage du node
      # (voir le log actionnable dans face_sim_node.py).
      - ../../../medias:/home/ros2_ws/src/robot/medias

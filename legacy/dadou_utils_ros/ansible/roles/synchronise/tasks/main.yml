# Exclusions ajoutées au lot « Ansible nickel » (07/11) : `.venv/` (venv de test du PC, des
# centaines de Mo partis sur les Pi), `.pytest_cache/`, le workspace du banc x86 de la vision
# (`conf/docker/x86/workspace/`), et `conf/secret` — les secrets sont posés par le rôle
# `secrets` depuis le PC (hors dépôt) : le rsync ne doit JAMAIS en écraser un, même si un
# conf/secret traînait dans l'arbre du PC. Pas de --delete : rien de ce que le Pi porte
# n'est effacé par le rsync.
- name: Synchronize directory "{{ local_projects_dir }}/{{ local_project_dir }}/" with "{{ ros2_ws }}/src/{{ project_ros_dir }}"
  synchronize:
    src: "{{ local_projects_dir }}/{{ local_project_dir }}/"
    dest: "{{ ros2_ws }}/src/{{ project_ros_dir }}/"
    recursive: yes
    #delete: yes
    copy_links: yes
    rsync_opts:
      #- "--delete"
      - "--exclude=.git/"
      - "--exclude=node_modules/"
      - "--exclude=.~tmp~/"
      - "--exclude=.idea/"
      - "--exclude=__pycache__/"
      - "--exclude=venv/"
      - "--exclude=.venv/"
      - "--exclude=.pytest_cache/"
      - "--exclude=/conf/docker/x86/workspace/"
      - "--exclude=/conf/secret"
      # Sentinelles de build COMMITÉES depuis L0 (robot/change, vision/change) : la copier
      # recréait la sentinelle du robot à chaque passage (rsync « changed » sans fin) ; elle
      # est désormais posée par la dernière tâche de ce rôle.
      - "--exclude=/*/change"
      - "--exclude=/*/CHANGE"
      - "--exclude=.editorconfig"
      - "--exclude=.gitignore"
      #- "--exclude=didier_bringup/"
      #- "--exclude=theatre_interfaces/"

- name: Synchronize directory "{{ local_projects_dir }}/{{ local_project_dir }}/conf/ros2/" with "{{ ros2_ws }}/src/{{ project_ros_dir }}/"
  synchronize:
    src: "{{ local_projects_dir }}/{{ local_project_dir }}/conf/ros2/"
    dest: "{{ ros2_ws }}/src/{{ project_ros_dir }}/"
    recursive: yes
    copy_links: yes
    #rsync_opts:
    #  - "--delete"

# Nettoyage des packages RENOMMÉS (lot L1e-2) : chaque ancien nom de
# `packages_retires` (vars/main.yml) est effacé de src/, build/ et install/ AVANT
# la copie ci-dessous — le rsync n'efface rien et `colcon build` compilerait sinon
# les anciens ET les nouveaux. `become` : build/ et install/ sont écrits par le
# colcon du conteneur, donc par root. Chemin ABSOLU (ansible_env.HOME = l'utilisateur
# de connexion, faits relevés sans become) : avec sudo, un chemin relatif dépendrait
# du répertoire courant. La liste ne se vide jamais (un Pi resté éteint rattrape).
- name: Remove renamed package "{{ item.0 }}" from "{{ ros2_ws }}/{{ item.1 }}/"
  become: yes
  file:
    path: "{{ ansible_env.HOME }}/{{ ros2_ws }}/{{ item.1 }}/{{ item.0 }}"
    state: absent
  loop: "{{ packages_retires | product(['src', 'build', 'install']) | list }}"

# Lot « Ansible nickel » (07/11) : quelles entrées de `chemins_retires_lib` sont ENCORE sous
# leur forme ancienne ? src/* : présentes = anciennes (la lib n'y vit plus). build/<projet> et
# install/<projet> : anciennes seulement si elles contiennent un dossier `dadou_utils_ros`
# (la copie embarquée d'avant L1e-3a). Avant ce lot, build/ et install/ de robot et vision
# étaient effacés à CHAQUE déploiement : rebuild complet obligatoire, et sans sentinelle la
# vision mourait (`Package 'vision' not found`, vécu le 07/11). Lecture seule : exécutée
# aussi en --check, jamais « changed ».
- name: Detect old embedded dadou_utils_ros forms still on the Pi
  become: yes
  shell: |
    cd "{{ ansible_env.HOME }}/{{ ros2_ws }}" 2>/dev/null || exit 0
    for chemin in {{ chemins_retires_lib | join(' ') }}; do
      case "$chemin" in
        src/*) [ -e "$chemin" ] && echo "$chemin" ;;
        *) [ -d "$chemin" ] && find "$chemin" -name dadou_utils_ros -print -quit | grep -q . \
             && echo "$chemin" ;;
      esac
    done
    exit 0
  register: lib_embarquee
  changed_when: false
  check_mode: false

# Lot L1e-3a (07/11) : la lib dadou_utils_ros est devenue le package src/dadou_utils_ros
# (packages_default) ; ses copies embarquées d'avant (src/<projet>/dadou_utils_ros, issues du
# lien symbolique suivi par le rsync `copy_links` ci-dessus) sont effacées AVANT la copie des
# packages. Même motif que packages_retires : `become` (build/install du conteneur sont à
# root), chemin ABSOLU, liste gravée qui ne se vide jamais (vars/main.yml). Depuis le lot
# « Ansible nickel » : seulement les entrées détectées sous leur forme ancienne (tâche
# précédente) — un build/install sain n'est plus jamais effacé.
- name: Remove embedded dadou_utils_ros "{{ item }}"
  become: yes
  file:
    path: "{{ ansible_env.HOME }}/{{ ros2_ws }}/{{ item }}"
    state: absent
  loop: "{{ chemins_retires_lib }}"
  when: item in lib_embarquee.stdout_lines

# Déchets laissés par l'ancien rsync (vars/main.yml, `dechets_rsync`) : désormais exclus de
# la copie, effacés ici s'ils sont encore sur le Pi.
- name: Remove rsync leftovers (dechets_rsync) from "{{ ros2_ws }}/src/{{ project_ros_dir }}/"
  become: yes
  file:
    path: "{{ ansible_env.HOME }}/{{ ros2_ws }}/src/{{ project_ros_dir }}/{{ item }}"
    state: absent
  loop: "{{ dechets_rsync }}"

# Packages du mono-dépôt (theatre-robot/packages/) : lot L1a (2026-11-02) pour les
# communs, lot L1e-1 (2026-11-06) pour les 6 packages ROS autonomes du robot qui
# vivaient dans conf/ du robot (le dossier a disparu — plus de stat ni de rsync
# conditionnel). Chaque machine reçoit une LISTE EXPLICITE : `packages` de l'hôte
# (ansible/hosts), à défaut `packages_default` (vars/main.yml). Pourquoi explicite
# et non « tout packages/ » : le `colcon build` d'un Pi compile TOUT ros2_ws/src/ ;
# un package qui n'a rien à y faire (didier_jeu, sim-only ; didier_drive et son
# twist_mux sur le Pi vision...) y casserait la compilation sur ses dépendances
# manquantes, ou y tournerait pour rien. Les communs (theatre_contrats,
# theatre_interfaces) sont obligatoires partout : dadou_utils_ros/utils_static.py
# importe theatre_contrats — sans lui, tous les nodes tombent au démarrage.
# Un package absent de packages/ fait échouer le rsync (code 23) : c'est voulu,
# test_arborescence.py le détecte avant. Ne PAS nommer `packages` une liste d'apt.
- name: Synchronize mono-repo package "{{ item }}" with "{{ ros2_ws }}/src/{{ item }}/"
  synchronize:
    src: "{{ packages_dir }}/{{ item }}/"
    dest: "{{ ros2_ws }}/src/{{ item }}/"
    recursive: yes
    copy_links: yes
    rsync_opts:
      - "--exclude=.git/"
      - "--exclude=__pycache__/"
      - "--exclude=.pytest_cache/"
      - "--exclude=*.egg-info/"
      - "--exclude=README.md"
  loop: "{{ packages | default(packages_default) }}"

# Lot L1c (2026-11-04) : le robot publie le sha déployé (topic `deploy_sha`, nœud
# catalogue_node de didier_web ; badge « version » de la console web). Le fichier est
# lu dans le conteneur à /home/ros2_ws/src/robot/conf/DEPLOY_SHA (conf/ est monté).
# Le lookup `pipe` s'exécute sur le PC (le git n'existe pas sur le Pi) ; `-C` sur
# legacy/ remonte au dépôt theatre-robot. Suffixe `-dirty` OBLIGATOIRE si l'arbre
# de travail diffère du commit : le rsync copie l'arbre, pas le commit — un sha
# propre mentirait. Robot seulement pour L1c (vision/télécommande : quand
# machines/<hôte>/ existera, L1e). Côté PC, conf/DEPLOY_SHA n'existe jamais
# (gitignoré) : la sim affiche « dev ».
- name: Write the deployed git sha (robot only, read by catalogue_node)
  copy:
    content: "{{ lookup('pipe', 'git -C ' ~ local_projects_dir ~ ' rev-parse HEAD') }}{{ '-dirty' if lookup('pipe', 'git -C ' ~ local_projects_dir ~ ' status --porcelain') else '' }}\n"
    dest: "{{ ros2_ws }}/src/{{ project_ros_dir }}/conf/DEPLOY_SHA"
    mode: "0644"
  when: project_ros_dir == 'robot'

# Sentinelle de build, posée à CHAQUE synchronisation (lot « Ansible nickel », 07/11 ; geste
# manuel `touch` jusque-là) : le launch-ros-in-docker.sh du projet lance `colcon build` au
# démarrage du conteneur si elle existe, puis l'efface. Toujours la poser = le code rsyncé est
# toujours celui qui tourne (le build est incrémental, build/ et install/ ne sont plus effacés).
# Nom par hôte (`sentinelle_build` dans hosts) : robot/change, vision/CHANGE — gardés tels que
# les lisent les scripts, puisque plus personne ne les tape à la main. Pas en --check (elle
# n'existe que le temps d'un démarrage : la détection d'écart la verrait toujours manquer).
- name: Set the colcon build sentinel "{{ sentinelle_build | default('') }}"
  file:
    path: "{{ ansible_env.HOME }}/{{ ros2_ws }}/{{ sentinelle_build }}"
    state: touch
    access_time: preserve
    modification_time: preserve
  when:
    - sentinelle_build is defined
    - not ansible_check_mode

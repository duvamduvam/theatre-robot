- name: Synchronize directory "{{ local_projects_dir }}/{{ local_project_dir }}/" with "{{ ros2_ws }}/src/{{ project_ros_dir }}"
  synchronize:
    src: "{{ local_projects_dir }}/{{ local_project_dir }}/"
    dest: "{{ ros2_ws }}/src/{{ project_ros_dir }}/"
    recursive: yes
    #delete: yes
    copy_links: yes
    rsync_opts:
      #- "--delete"
      - "--exclude=.git/"
      - "--exclude=node_modules/"
      - "--exclude=.~tmp~/"
      - "--exclude=.idea/"
      - "--exclude=__pycache__/"
      - "--exclude=venv/"
      - "--exclude=.editorconfig"
      - "--exclude=.gitignore"
      #- "--exclude=robot_bringup/"
      #- "--exclude=robot_interfaces/"

- name: Synchronize directory "{{ local_projects_dir }}/{{ local_project_dir }}/conf/ros2/" with "{{ ros2_ws }}/src/{{ project_ros_dir }}/"
  synchronize:
    src: "{{ local_projects_dir }}/{{ local_project_dir }}/conf/ros2/"
    dest: "{{ ros2_ws }}/src/{{ project_ros_dir }}/"
    recursive: yes
    copy_links: yes
    #rsync_opts:
    #  - "--delete"

# Lot L1a (2026-11-02) : vision et télécommande n'ont PLUS de conf/ros2_dependencies
# (robot_interfaces est passé dans theatre-robot/packages/). Un rsync sur un dossier
# source absent échoue (code 23) et bloquerait les tâches suivantes — dont la copie des
# packages communs ci-dessous. D'où le stat côté PC et la condition.
- name: Check whether "{{ local_projects_dir }}/{{ local_project_dir }}/conf/ros2_dependencies/" exists on the control node
  stat:
    path: "{{ local_projects_dir }}/{{ local_project_dir }}/conf/ros2_dependencies/"
  delegate_to: localhost
  become: no
  register: ros2_dependencies_dir

- name: Synchronize directory "{{ local_projects_dir }}/{{ local_project_dir }}/conf/ros2_dependencies/" with "{{ ros2_ws }}/src/"
  synchronize:
    src: "{{ local_projects_dir }}/{{ local_project_dir }}/conf/ros2_dependencies/"
    dest: "{{ ros2_ws }}/src/"
    recursive: yes
    copy_links: yes
    #rsync_opts:
    #  - "--delete"
  when: ros2_dependencies_dir.stat.exists

# Lot L1a (2026-11-02) : les packages communs du mono-dépôt vivent dans
# theatre-robot/packages/ (hors de l'ancien dépôt) ; ils doivent arriver dans
# ros2_ws/src/<package> sur CHAQUE machine, car dadou_utils_ros/utils_static.py
# importe theatre_contrats — sans lui, tous les nodes tombent au démarrage.
# Copie de l'arbre entier (petit : pur Python + 4 .msg), exclusions comme ci-dessus.
- name: Synchronize mono-repo packages "{{ packages_dir }}/" with "{{ ros2_ws }}/src/"
  synchronize:
    src: "{{ packages_dir }}/"
    dest: "{{ ros2_ws }}/src/"
    recursive: yes
    copy_links: yes
    rsync_opts: "{{ ['--exclude=.git/', '--exclude=__pycache__/', '--exclude=*.egg-info/', '--exclude=README.md']
                    + (packages_sim_only | default([]) | map('regex_replace', '^(.*)$', '--exclude=\\1/') | list) }}"

# Lot L1c (2026-11-04) : le robot publie le sha déployé (topic `deploy_sha`, nœud
# catalogue_node de robot_web ; badge « version » de la console web). Le fichier est
# lu dans le conteneur à /home/ros2_ws/src/robot/conf/DEPLOY_SHA (conf/ est monté).
# Le lookup `pipe` s'exécute sur le PC (le git n'existe pas sur le Pi) ; `-C` sur
# legacy/ remonte au dépôt theatre-robot. Suffixe `-dirty` OBLIGATOIRE si l'arbre
# de travail diffère du commit : le rsync copie l'arbre, pas le commit — un sha
# propre mentirait. Robot seulement pour L1c (vision/télécommande : quand
# machines/<hôte>/ existera, L1e). Côté PC, conf/DEPLOY_SHA n'existe jamais
# (gitignoré) : la sim affiche « dev ».
- name: Write the deployed git sha (robot only, read by catalogue_node)
  copy:
    content: "{{ lookup('pipe', 'git -C ' ~ local_projects_dir ~ ' rev-parse HEAD') }}{{ '-dirty' if lookup('pipe', 'git -C ' ~ local_projects_dir ~ ' status --porcelain') else '' }}\n"
    dest: "{{ ros2_ws }}/src/{{ project_ros_dir }}/conf/DEPLOY_SHA"
    mode: "0644"
  when: project_ros_dir == 'robot'

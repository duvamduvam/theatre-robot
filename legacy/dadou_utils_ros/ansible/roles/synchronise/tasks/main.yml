
# Lot « Ansible nickel » (07/11) : le squelette du workspace est créé ici, en utilisateur de
# connexion, AVANT tout rsync. Pourquoi : rsync ne crée que le dernier niveau de sa
# destination (un ~/ros2_ws effacé faisait échouer la copie), et un dossier absent au premier
# `compose up` est créé par Docker EN ROOT (build/, install/, log/ montés).
- name: Ensure the colcon workspace skeleton exists
  file:
    path: "{{ ansible_env.HOME }}/{{ ros2_ws }}/{{ item }}"
    state: directory
  loop: [src, build, install, log]

# Docker crée aussi en root les points de montage absents sous src/ (json/, medias/,
# robot/…) : le rsync suivant, en utilisateur de connexion, échouait en code 23 (geste
# manuel `sudo chown -R pi:pi ~/ros2_ws/src` du 07/11). Le conteneur tourne en root : il
# lit tout, rendre src/ à l'utilisateur (fait `ansible_user_id`) ne lui retire rien.
- name: Give "{{ ros2_ws }}/src" back to the connection user before rsync
  become: yes
  file:
    path: "{{ ansible_env.HOME }}/{{ ros2_ws }}/src"
    state: directory
    recurse: yes
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"


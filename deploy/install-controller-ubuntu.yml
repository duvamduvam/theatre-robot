---
- name: install didier
  hosts: controller
#  become: yes

  vars_files:
  - vars/main.yml

  # Lot L1e-4c (11/11) : le CONTENU de la machine (packages, launch, nœuds attendus, secrets…) vit
  # dans machines/<machine>/machine.yml, `machine` étant la seule variable de contenu de l'hôte
  # dans hosts. Chargé AVANT les rôles (pre_tasks), aussi en --check (ecart-pi.sh).
  pre_tasks:
    - name: Load the machine content machines/{{ machine }}/machine.yml
      ansible.builtin.include_vars:
        file: "{{ machines_dir }}/{{ machine }}/machine.yml"

  roles:
    - role: dir_struct
    - role: synchronise
    - role: linux-package
    - role: python
    - role: set-bashrc
      vars:
        set_bashrc_project_file: "{{ conf_machine_dir }}/rpi/project_bash"
    - role: ros_humble_base
    - role: ros_humble_desktop
    - role: colcon_build


# Rôle conteneur (lot « Ansible nickel », 07/11) : fin de déploiement sans geste manuel.
# Avant : `docker restart` à la main, qui ne relit PAS le compose (nouveaux montages ignorés,
# vécu au L1a et au 3b), puis vérification à l'œil. Ici : recréation, attente du colcon build
# (déclenché par la sentinelle du rôle synchronise), contrôle minimal qui fait ÉCHOUER le
# playbook. Rien de tout ça en --check : la détection d'écart ne redémarre jamais un Pi.

# Points de montage du compose ABSENTS du dépôt (vision : medias/) : Docker les créerait en
# root au `up`, et le chown du déploiement suivant les verrait comme un écart (vu au
# redéploiement à blanc du 07/11). Créés ici, en utilisateur de connexion. Liste par hôte.
- name: Create compose mount points missing from the repository
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ ros2_ws }}/src/{{ project_ros_dir }}/{{ item }}"
    state: directory
  loop: "{{ dossiers_montes }}"

# Image changée → build/ et install/ de l'hôte sont PÉRIMÉS (vécu le 08/11 au L1e-3d : nouvelle
# image de la vision = libfastcdr plus récente ; le cache CMake de build/theatre_interfaces, sur
# l'hôte, visait l'ancienne bibliothèque → « No rule to make target libfastcdr.so.2.2.7 », plus
# rien ne compilait). L'identifiant de l'image avec laquelle build/ a été produit est noté dans
# ~/ros2_ws/.image-du-build ; s'il diffère de l'image du compose, build/ et install/ sont vidés
# (le workspace vide déclenche un colcon build complet au démarrage, sentinelle ou non).
- name: Read the image id the compose will run
  become: yes
  ansible.builtin.shell: >-
    docker image inspect -f '{% raw %}{{.Id}}{% endraw %}'
    "$(docker compose -f "{{ conteneur_compose }}" config --images | head -1)"
  register: image_courante
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the image id the current build was made with
  ansible.builtin.slurp:
    src: "{{ ansible_env.HOME }}/{{ ros2_ws }}/.image-du-build"
  register: image_du_build
  failed_when: false
  check_mode: false

- name: Clear build/ and install/ built with another image
  become: yes
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ ros2_ws }}/{{ item }}"
    state: absent
  loop: [build, install]
  when:
    - image_courante.rc == 0
    - (image_du_build.content | default('') | b64decode | trim) != image_courante.stdout

- name: Recreate empty build/ and install/ mount points as the login user
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ ros2_ws }}/{{ item }}"
    state: directory
  loop: [build, install]

- name: Record the image id of this build
  ansible.builtin.copy:
    content: "{{ image_courante.stdout }}\n"
    dest: "{{ ansible_env.HOME }}/{{ ros2_ws }}/.image-du-build"
    mode: "0644"
  when: image_courante.rc == 0

# `up -d --force-recreate` : relit le compose (volumes, environnement) et redémarre même si
# rien n'a changé dans le compose — c'est le redémarrage qui fait compiler la sentinelle.
# L'image locale est réutilisée (pas de pull : celle du Hub est périmée, docs/ansible-ecarts.md).
- name: Recreate the project container
  become: yes
  ansible.builtin.command:
    cmd: docker compose -f "{{ conteneur_compose }}" up -d --force-recreate
  when: not ansible_check_mode

# Les nœuds n'apparaissent qu'après le colcon build du script d'entrée : les voir = build fini
# ET lancement réussi. `failed_when: false` pour que la tâche suivante dise CE qui manque.
- name: Wait for colcon build and ROS nodes ({{ noeuds_attendus | length }} expected)
  become: yes
  ansible.builtin.shell: >-
    docker exec {{ conteneur_nom }} bash -c
    'source /opt/ros/$ROS_DISTRO/setup.bash && ros2 node list --no-daemon --spin-time 3'
  register: noeuds_vus
  until: noeuds_attendus | difference(noeuds_vus.stdout_lines | default([])) | length == 0
  retries: "{{ conteneur_essais }}"
  delay: "{{ conteneur_delai }}"
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - noeuds_attendus | length > 0

- name: Fail if expected ROS nodes are missing
  ansible.builtin.fail:
    msg: >-
      Nœuds absents après {{ conteneur_essais * conteneur_delai }} s :
      {{ noeuds_attendus | difference(noeuds_vus.stdout_lines | default([])) | join(', ') }}.
      Voir `sudo docker logs {{ conteneur_nom }}` sur {{ inventory_hostname }}.
  when:
    - not ansible_check_mode
    - noeuds_attendus | length > 0
    - noeuds_attendus | difference(noeuds_vus.stdout_lines | default([])) | length > 0

# Contrôle d'état APRÈS l'attente : un conteneur qui boucle (restart: unless-stopped du robot)
# peut être « running » à l'instant t avec un compteur de redémarrages qui grimpe.
- name: Read container state and restart count
  become: yes
  ansible.builtin.command:
    cmd: docker inspect -f '{% raw %}{{.State.Status}} {{.RestartCount}}{% endraw %}' {{ conteneur_nom }}
  register: etat_conteneur
  changed_when: false
  failed_when: etat_conteneur.rc != 0 or etat_conteneur.stdout != 'running 0'
  when: not ansible_check_mode

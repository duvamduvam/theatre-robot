#    src: "{{ local_projects_dir }}/{{ local_project_dir }}/didier_bringup"
#    dest: "{{ ros2_ws }}/src/"
#    recursive: yes
#    delete: yes
#    copy_links: yes

#- name: Synchronize directory "{{ local_projects_dir }}/{{ local_project_dir }}//robot_interface" with "{{ ros2_ws }}/src/"

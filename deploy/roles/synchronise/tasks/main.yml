# Exclusions ajoutées au lot « Ansible nickel » (07/11) : `.venv/` (venv de test du PC, des
# centaines de Mo partis sur les Pi), `.pytest_cache/`, le workspace du banc x86 de la vision
# (`conf/docker/x86/workspace/`), et `conf/secret` — les secrets sont posés par le rôle
# `secrets` depuis le PC (hors dépôt) : le rsync ne doit JAMAIS en écraser un, même si un
# conf/secret traînait dans l'arbre du PC. Pas de --delete : rien de ce que le Pi porte
# n'est effacé par le rsync.
# Lot L1e-4b (08/11) : copie « projet » réservée aux hôtes SANS `donnees_dir` ; le robot reçoit à
# la place les copies explicites qui suivent. Lot L1e-4c (11/11) : réservée aux machines dont le
# projet vit ENCORE dans legacy/ (`local_project_dir` dans leur machine.yml : télécommande, gants
# — sono et disque retirés le 11/11) ; robot et vision reçoivent leur conf depuis machines/<machine>/ (plus bas).
- name: Synchronize directory "{{ local_projects_dir }}/{{ local_project_dir | default('') }}/" with "{{ ros2_ws }}/src/{{ project_ros_dir }}"
  when: local_project_dir is defined
  synchronize:
    src: "{{ local_projects_dir }}/{{ local_project_dir }}/"
    dest: "{{ ros2_ws }}/src/{{ project_ros_dir }}/"
    recursive: yes
    #delete: yes
    copy_links: yes
    rsync_opts:
      #- "--delete"
      # Dates des DOSSIERS non copiées : cette tâche et la suivante écrivent dans la même
      # destination, chacune imposait la date de sa racine — rsync « changed » à chaque passage
      # (de même pour vision/, touché par la sentinelle). Les dates des fichiers restent copiées.
      - "--omit-dir-times"
      - "--exclude=.git/"
      - "--exclude=node_modules/"
      - "--exclude=.~tmp~/"
      - "--exclude=.idea/"
      - "--exclude=__pycache__/"
      - "--exclude=venv/"
      - "--exclude=.venv/"
      - "--exclude=.pytest_cache/"
      - "--exclude=/conf/docker/x86/workspace/"
      # Même déchet côté sim (workspace colcon de la fumée, gitignoré) : vu rouge le 08/11 pendant
      # une fumée. Gardé pour les hôtes qui reçoivent encore la copie « projet » ; la copie conf/
      # du robot ci-dessous porte la même exclusion.
      - "--exclude=/conf/docker/sim/workspace/"
      - "--exclude=/conf/secret"
      # Sentinelles de build COMMITÉES depuis L0 (robot/change, vision/change) : la copier
      # recréait la sentinelle du robot à chaque passage (rsync « changed » sans fin) ; elle
      # est désormais posée par la dernière tâche de ce rôle.
      - "--exclude=/*/change"
      - "--exclude=/*/CHANGE"
      - "--exclude=.editorconfig"
      - "--exclude=.gitignore"
      #- "--exclude=didier_bringup/"
      #- "--exclude=theatre_interfaces/"

# Lot L1e-4b (08/11) : données du robot. data/{json,medias,db} du dépôt → src/robot/{json,medias,db}
# (chemin Pi INCHANGÉ : DIDIER_DATA_DIR, compose ARM et Dockerfile-arm les y lisent). Hôte robot
# seul (`donnees_dir` de machines/robot/machine.yml). Une copie PAR dossier, nommée : rien d'autre de data/ (README)
# ne part. Pas de --delete, comme la copie « projet » qu'elles remplacent.
# L1d-4 (13/11) : `/backup/` (json/backup/ : sauvegardes, temporaires et journal des éditions
# de l'écrivain — ceux d'une sim du PC ne partent jamais sur le Pi, et ceux du Pi ne sont jamais
# écrasés) et `/.tmp/` (medias/.tmp/, temporaire des images de l'écrivain) exclus.
- name: Synchronize robot data "{{ donnees_dir | default('') }}/{{ item }}/" with "{{ ros2_ws }}/src/{{ project_ros_dir }}/{{ item }}/"
  when: donnees_dir is defined
  synchronize:
    src: "{{ donnees_dir }}/{{ item }}/"
    dest: "{{ ros2_ws }}/src/{{ project_ros_dir }}/{{ item }}/"
    recursive: yes
    copy_links: yes
    rsync_opts:
      - "--omit-dir-times"
      - "--exclude=.~tmp~/"
      - "--exclude=__pycache__/"
      - "--exclude=/backup/"
      - "--exclude=/.tmp/"
  loop: [json, medias, db]

# Lot L1e-4c (11/11) : la conf de la machine = machines/<machine>/ (`conf_machine_dir` du
# machine.yml) -> src/<projet>/conf/, chemin Pi INCHANGÉ (ex copie de legacy/dadou_robot_ros/conf/
# du L1e-4b ; la vision la reçoit aussi, à la place de sa copie « projet »). Machines dont le projet
# vit encore dans legacy/ : leur conf/ arrive avec la copie « projet » (plus haut). Exclus :
# machine.yml et README.md (le contenu et la doc de la machine, lus sur le PC seulement),
# `secret` (rôle secrets, jamais le rsync), caches Python. Les bancs x86 (workspaces colcon de la
# fumée) ne sont plus sous machines/robot|vision : machines/sim/ ne part sur aucun Pi.
- name: Synchronize machine conf "{{ conf_machine_dir | default('') }}/" with "{{ ros2_ws }}/src/{{ project_ros_dir }}/conf/"
  when: local_project_dir is not defined
  synchronize:
    src: "{{ conf_machine_dir }}/"
    dest: "{{ ros2_ws }}/src/{{ project_ros_dir }}/conf/"
    recursive: yes
    copy_links: yes
    rsync_opts:
      - "--omit-dir-times"
      - "--exclude=.git/"
      - "--exclude=node_modules/"
      - "--exclude=.~tmp~/"
      - "--exclude=.idea/"
      - "--exclude=__pycache__/"
      - "--exclude=venv/"
      - "--exclude=.venv/"
      - "--exclude=.pytest_cache/"
      - "--exclude=/machine.yml"
      - "--exclude=/README.md"
      - "--exclude=/secret"

- name: Synchronize directory "{{ local_projects_dir }}/{{ local_project_dir }}/conf/ros2/" with "{{ ros2_ws }}/src/{{ project_ros_dir }}/"
  # La vision n'a plus de conf/ros2/ depuis L1e-3d (sa forme ament est dans packages/didier_vision).
  # L1e-4b : plus pour le robot non plus — son conf/ros2/ ne portait plus que launch.txt, que
  # rien ne lit (déchet effacé par chemins_retires_legacy_robot) ; il arrive avec conf/.
  # L1e-4c : seulement les machines restées dans legacy/ (même condition que la copie « projet »).
  when:
    - local_project_dir is defined
    - (local_projects_dir ~ '/' ~ local_project_dir ~ '/conf/ros2') is directory
  synchronize:
    src: "{{ local_projects_dir }}/{{ local_project_dir }}/conf/ros2/"
    dest: "{{ ros2_ws }}/src/{{ project_ros_dir }}/"
    recursive: yes
    copy_links: yes
    rsync_opts:
      #- "--delete"
      - "--omit-dir-times"
      # Points de montage vides créés EN ROOT dans conf/ros2/ par un Docker du PC (vu le 07/11,
      # non suivis par git) : les copier imposait leurs droits 755 aux vrais json/, medias/ et
      # robot/ du projet, que la tâche précédente remettait en 775 — « changed » sans fin.
      - "--exclude=/json/"
      - "--exclude=/medias/"
      - "--exclude=/robot/"
      # Même artefact pour la lib (ancien point de montage du symlink, avant L1e-3a) : absent du
      # worktree, présent dans le checkout de main → « changed » au --check (vu le 07/11 au soir).
      - "--exclude=/dadou_utils_ros/"

# Nettoyage des packages RENOMMÉS (lot L1e-2) : chaque ancien nom de
# `packages_retires` (vars/main.yml) est effacé de src/, build/ et install/ AVANT
# la copie ci-dessous — le rsync n'efface rien et `colcon build` compilerait sinon
# les anciens ET les nouveaux. `become` : build/ et install/ sont écrits par le
# colcon du conteneur, donc par root. Chemin ABSOLU (ansible_env.HOME = l'utilisateur
# de connexion, faits relevés sans become) : avec sudo, un chemin relatif dépendrait
# du répertoire courant. La liste ne se vide jamais (un Pi resté éteint rattrape).
- name: Remove renamed package "{{ item.0 }}" from "{{ ros2_ws }}/{{ item.1 }}/"
  become: yes
  file:
    path: "{{ ansible_env.HOME }}/{{ ros2_ws }}/{{ item.1 }}/{{ item.0 }}"
    state: absent
  loop: "{{ packages_retires | product(['src', 'build', 'install']) | list }}"

# Lot « Ansible nickel » (07/11) : quelles entrées de `chemins_retires_lib` sont ENCORE sous
# leur forme ancienne ? src/* : présentes = anciennes (la lib n'y vit plus). build/<projet> et
# install/<projet> : anciennes seulement si elles contiennent un dossier `dadou_utils_ros`
# (la copie embarquée d'avant L1e-3a). Avant ce lot, build/ et install/ de robot et vision
# étaient effacés à CHAQUE déploiement : rebuild complet obligatoire, et sans sentinelle la
# vision mourait (`Package 'vision' not found`, vécu le 07/11). Lecture seule : exécutée
# aussi en --check, jamais « changed ».
- name: Detect old embedded dadou_utils_ros forms still on the Pi
  become: yes
  shell: |
    cd "{{ ansible_env.HOME }}/{{ ros2_ws }}" 2>/dev/null || exit 0
    for chemin in {{ chemins_retires_lib | join(' ') }}; do
      case "$chemin" in
        src/*) [ -e "$chemin" ] && echo "$chemin" ;;
        *) [ -d "$chemin" ] && find "$chemin" -name dadou_utils_ros -print -quit | grep -q . \
             && echo "$chemin" ;;
      esac
    done
    exit 0
  register: lib_embarquee
  changed_when: false
  check_mode: false

# Lot L1e-3a (07/11) : la lib dadou_utils_ros est devenue le package src/dadou_utils_ros
# (packages_default) ; ses copies embarquées d'avant (src/<projet>/dadou_utils_ros, issues du
# lien symbolique suivi par le rsync `copy_links` ci-dessus) sont effacées AVANT la copie des
# packages. Même motif que packages_retires : `become` (build/install du conteneur sont à
# root), chemin ABSOLU, liste gravée qui ne se vide jamais (vars/main.yml). Depuis le lot
# « Ansible nickel » : seulement les entrées détectées sous leur forme ancienne (tâche
# précédente) — un build/install sain n'est plus jamais effacé.
- name: Remove embedded dadou_utils_ros "{{ item }}"
  become: yes
  file:
    path: "{{ ansible_env.HOME }}/{{ ros2_ws }}/{{ item }}"
    state: absent
  loop: "{{ chemins_retires_lib }}"
  when: item in lib_embarquee.stdout_lines

# Lot L1e-3c (07/11) : le cœur `robot` est devenu le package src/didier_core. Quelles entrées de
# `chemins_retires_robot` (vars/main.yml) portent ENCORE l'ancienne forme ? Toutes : rien ne les
# recrée plus (le rsync du projet n'a plus ni robot/, ni conf/ros2/setup.py…, et aucun package ne
# s'appelle plus `robot`) — présente = ancienne. Lecture seule, exécutée aussi en --check, jamais
# « changed » : un Pi déjà nettoyé ne voit aucune tâche bouger (ecart-pi.sh vert).
- name: Detect old robot package forms still on the Pi
  become: yes
  shell: |
    cd "{{ ansible_env.HOME }}/{{ ros2_ws }}" 2>/dev/null || exit 0
    for chemin in {{ (chemins_retires_robot + chemins_retires_vision + chemins_retires_legacy_robot + chemins_retires_sim + chemins_retires_legacy_vision) | join(' ') }}; do
      [ -e "$chemin" ] && echo "$chemin"
    done
    exit 0
  register: robot_ancien
  changed_when: false
  check_mode: false

# Effacement AVANT la copie des packages : sinon le colcon build suivant compilerait l'ancien
# package `robot` (src/robot/package.xml) à côté de didier_core — deux jeux des mêmes
# exécutables, et un install/robot périmé sur le PYTHONPATH. Même motif que les nettoyages
# ci-dessus : `become`, chemin ABSOLU, seulement les entrées détectées.
- name: Remove old robot package "{{ item }}"
  become: yes
  file:
    path: "{{ ansible_env.HOME }}/{{ ros2_ws }}/{{ item }}"
    state: absent
  # L1e-3d : même tâche pour la vision (chemins distincts, absents de l'autre hôte). L1e-4b : et
  # pour les déchets de l'ancienne copie « projet » du robot (chemins_retires_legacy_robot).
  # L1e-4c : et pour la partie sim de l'ancienne conf/ (chemins_retires_sim) et les déchets de
  # l'ancienne copie « projet » de la vision (chemins_retires_legacy_vision).
  loop: "{{ chemins_retires_robot + chemins_retires_vision + chemins_retires_legacy_robot + chemins_retires_sim + chemins_retires_legacy_vision }}"
  when: item in robot_ancien.stdout_lines

# Déchets laissés par l'ancien rsync (vars/main.yml, `dechets_rsync`) : désormais exclus de
# la copie, effacés ici s'ils sont encore sur le Pi.
- name: Remove rsync leftovers (dechets_rsync) from "{{ ros2_ws }}/src/{{ project_ros_dir }}/"
  become: yes
  file:
    path: "{{ ansible_env.HOME }}/{{ ros2_ws }}/src/{{ project_ros_dir }}/{{ item }}"
    state: absent
  loop: "{{ dechets_rsync }}"

# Packages du mono-dépôt (theatre-robot/packages/) : lot L1a (2026-11-02) pour les
# communs, lot L1e-1 (2026-11-06) pour les 6 packages ROS autonomes du robot qui
# vivaient dans conf/ du robot (le dossier a disparu — plus de stat ni de rsync
# conditionnel). Chaque machine reçoit une LISTE EXPLICITE : `packages` de l'hôte
# (machines/<machine>/machine.yml depuis L1e-4c), à défaut `packages_default` (vars/main.yml). Pourquoi explicite
# et non « tout packages/ » : le `colcon build` d'un Pi compile TOUT ros2_ws/src/ ;
# un package qui n'a rien à y faire (didier_jeu, sim-only ; didier_drive et son
# twist_mux sur le Pi vision...) y casserait la compilation sur ses dépendances
# manquantes, ou y tournerait pour rien. Les communs (theatre_contrats,
# theatre_interfaces) sont obligatoires partout : dadou_utils_ros/utils_static.py
# importe theatre_contrats — sans lui, tous les nodes tombent au démarrage.
# Un package absent de packages/ fait échouer le rsync (code 23) : c'est voulu,
# test_arborescence.py le détecte avant. Ne PAS nommer `packages` une liste d'apt.
- name: Synchronize mono-repo package "{{ item }}" with "{{ ros2_ws }}/src/{{ item }}/"
  synchronize:
    src: "{{ packages_dir }}/{{ item }}/"
    dest: "{{ ros2_ws }}/src/{{ item }}/"
    recursive: yes
    copy_links: yes
    rsync_opts:
      # Dates des DOSSIERS non copiées (L1e-3c, 08/11) : la sentinelle de didier_core vit à la
      # racine du package (posée par ce rôle, effacée par le conteneur après le build) et
      # change la date de src/didier_core/ — rsync « changed » à chaque passage sinon (même
      # remède que la copie du projet plus haut).
      - "--omit-dir-times"
      - "--exclude=.git/"
      # Venvs du PC (L1e-4e : packages/didier_vision/.venv) : jamais vers un Pi.
      - "--exclude=.venv/"
      - "--exclude=venv/"
      - "--exclude=__pycache__/"
      - "--exclude=.pytest_cache/"
      - "--exclude=*.egg-info/"
      - "--exclude=README.md"
      # Sentinelle de build du cœur (packages/didier_core/change, gitignorée, écrite par le
      # Makefile sur le PC) : posée par la dernière tâche de ce rôle, jamais copiée — sinon
      # le --check d'ecart-pi.sh la verrait manquer après chaque build (effacée par le script).
      - "--exclude=/change"
  loop: "{{ packages | default(packages_default) }}"

# Lot L1c (2026-11-04) : le robot publie le sha déployé (topic `deploy_sha`, nœud
# catalogue_node de didier_web ; badge « version » de la console web). Le fichier est
# lu dans le conteneur à /home/ros2_ws/src/robot/conf/DEPLOY_SHA (conf/ est monté).
# Le lookup `pipe` s'exécute sur le PC (le git n'existe pas sur le Pi), à la racine du dépôt
# (`depot_dir`). Suffixe `-dirty` OBLIGATOIRE si l'arbre de travail diffère du commit : le
# rsync copie l'arbre, pas le commit — un sha propre mentirait. Depuis L1e-4b (08/11) : seuls
# les chemins DÉPLOYÉS comptent (`chemins_deployes`, vars/main.yml) — un fichier non suivi
# sous docs/ (journaux d'une fumée en cours) ne part sur aucun Pi et ne salit plus le sha. Robot seulement pour L1c (vision/télécommande : quand
# machines/<hôte>/ existera, L1e). Côté PC, conf/DEPLOY_SHA n'existe jamais
# (gitignoré) : la sim affiche « dev ».
- name: Write the deployed git sha (robot only, read by catalogue_node)
  copy:
    content: "{{ lookup('pipe', 'git -C ' ~ depot_dir ~ ' rev-parse HEAD') }}{{ '-dirty' if lookup('pipe', 'git -C ' ~ depot_dir ~ ' status --porcelain -- ' ~ (chemins_deployes | join(' '))) else '' }}\n"
    dest: "{{ ros2_ws }}/src/{{ project_ros_dir }}/conf/DEPLOY_SHA"
    mode: "0644"
  when: project_ros_dir == 'robot'

# Sentinelle de build, posée à CHAQUE synchronisation (lot « Ansible nickel », 07/11 ; geste
# manuel `touch` jusque-là) : le launch-ros-in-docker.sh du projet lance `colcon build` au
# démarrage du conteneur si elle existe, puis l'efface. Toujours la poser = le code rsyncé est
# toujours celui qui tourne (le build est incrémental, build/ et install/ ne sont plus effacés).
# Nom par machine (`sentinelle_build` du machine.yml) : robot/change, vision/CHANGE — gardés tels que
# les lisent les scripts, puisque plus personne ne les tape à la main. Pas en --check (elle
# n'existe que le temps d'un démarrage : la détection d'écart la verrait toujours manquer).
- name: Set the colcon build sentinel "{{ sentinelle_build | default('') }}"
  file:
    path: "{{ ansible_env.HOME }}/{{ ros2_ws }}/{{ sentinelle_build }}"
    state: touch
    access_time: preserve
    modification_time: preserve
  when:
    - sentinelle_build is defined
    - not ansible_check_mode


# Rôle secrets (lot « Ansible nickel », 07/11) : les clés d'API de la vision n'existaient que
# sur le Pi (relevé du 07/11) — une SD morte les emportait. Elles vivent désormais sur le PC
# dans `secrets_dir` (~/.config/didier/, chmod 600, hors dépôt public, hors Nextcloud) et ce
# rôle les pose. Règles : AUCUN contenu dans un log (no_log, pas de diff), échec CLAIR si une
# source manque, et le rsync du rôle synchronise exclut conf/secret (jamais écrasé par lui).

# Le test `is file` s'évalue sur le PC (contrôleur) : pas de connexion, pas de contenu lu.
- name: Fail if a secret source is missing on the PC
  ansible.builtin.fail:
    msg: >-
      Secret manquant sur le PC : {{ secrets_dir }}/{{ item.source }} (attendu pour
      ~/{{ item.dest }} sur {{ inventory_hostname }}). Le restaurer depuis la sauvegarde
      hors dépôt avant de redéployer — jamais depuis le dépôt (public).
  when: not ((secrets_dir ~ '/' ~ item.source) is file)
  loop: "{{ secrets_hote }}"
  loop_control:
    label: "{{ item.source }}"

# Chaque clé non commentée du modèle versionné (ex. conf/secret.example) doit exister dans la
# source. La commande ne sort QUE des noms de clés manquantes, jamais une valeur.
- name: Check that each secret holds the keys of its model
  ansible.builtin.shell: |
    for cle in $(grep -E '^[A-Za-z0-9_]+[[:space:]]*=' "{{ item.modele }}" | cut -d= -f1 | tr -d ' '); do
      grep -qE "^[[:space:]]*${cle}[[:space:]]*=" "{{ secrets_dir }}/{{ item.source }}" || echo "$cle"
    done
  delegate_to: localhost
  register: cles_manquantes
  changed_when: false
  check_mode: false
  when: item.modele is defined
  loop: "{{ secrets_hote }}"
  loop_control:
    label: "{{ item.source }}"

- name: Fail if a secret lacks a key of its model
  ansible.builtin.fail:
    msg: >-
      {{ secrets_dir }}/{{ item.item.source }} n'a pas les clés {{ item.stdout_lines | join(', ') }}
      exigées par {{ item.item.modele | basename }}.
  when: item.stdout_lines | default([]) | length > 0
  loop: "{{ cles_manquantes.results }}"
  loop_control:
    label: "{{ item.item.source }}"

# Dossier parent (ex. ~/didier_proto sur un Pi neuf) ; mode non imposé : s'il existe, c'est
# celui de l'outil, on n'y touche pas.
- name: Ensure the parent directory of each secret exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ item.dest | dirname }}"
    state: directory
  loop: "{{ secrets_hote }}"
  loop_control:
    label: "{{ item.dest | dirname }}"

- name: Push secrets from the PC (content never logged)
  ansible.builtin.copy:
    src: "{{ secrets_dir }}/{{ item.source }}"
    dest: "{{ ansible_env.HOME }}/{{ item.dest }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: "0600"
  no_log: true
  diff: false
  loop: "{{ secrets_hote }}"
  loop_control:
    label: "{{ item.dest }}"

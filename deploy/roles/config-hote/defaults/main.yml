---
# Système d'un hôte hors code ROS (lot « Ansible nickel », 07/11). Listes PAR MACHINE dans
# machines/<machine>/machine.yml (L1e-4c) ; vides par défaut : qui ne déclare rien ne reçoit rien.
# Paquets apt dont l'hôte a besoin (installés, jamais mis à jour ici : la mise à jour de
# l'OS est un geste à part, cf. docs/ansible-ecarts.md « grosse mise à jour »).
paquets_hote: []
# Unités systemd versionnées (chemin de la source sur le PC) : copiées dans
# /etc/systemd/system/<nom>, activées et démarrées.
unites_systemd: []
# Fichiers de /etc versionnés : liste de {source, dest}, propriétaire root, mode 0644.
fichiers_etc: []
# Fichiers lourds téléchargés sur l'hôte (modèles, voix) : liste de {url, dest, sha256}, dest
# relatif au $HOME de l'utilisateur. Téléchargés seulement s'ils manquent ou si l'empreinte
# diffère (get_url + checksum) ; l'empreinte gravée garantit le BON fichier.
telechargements_hote: []

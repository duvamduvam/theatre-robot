# Depuis le lot L0 (2026-11-02) les déploiements partent du mono-dépôt theatre-robot, dossier legacy/
# (les anciens dépôts frères sont archivés). Changera de nouveau quand machines/<hôte>/ existera.
# Lot « Ansible nickel » (07/11) : chemins DÉDUITS du playbook au lieu d'un chemin absolu vers le
# checkout principal — un worktree déploie SON arbre sans `-e local_projects_dir=… -e
# packages_dir=…` (surchargeables quand même par -e). Lot L1e-4a (08/11) : Ansible vit dans
# deploy/ à la racine du dépôt (ex legacy/dadou_utils_ros/ansible/) : un seul `dirname` mène
# à la racine, au lieu de deux (legacy/) et trois (packages/).
local_projects_dir: "{{ playbook_dir | dirname }}/legacy"
# Packages du mono-dépôt (rôle synchronise) : rsync vers ros2_ws/src/<package> de la
# machine. Liste PAR MACHINE : variable `packages` de l'hôte dans `hosts`, à défaut
# `packages_default` ci-dessous = les COMMUNS (lot L1a + dadou_utils_ros au lot L1e-3a),
# obligatoires partout (le shim utils_static.py importe theatre_contrats ; theatre_interfaces
# porte StringTime ; dadou_utils_ros est la lib partagée que tous les nodes importent —
# elle n'arrive plus par le symlink des 3 dépôts, supprimé en L1e-3a).
# Il n'y a plus de liste « sim-only à exclure » : un package sim-only (didier_jeu) n'est
# simplement dans la liste d'aucun hôte. Voir le commentaire du rôle pour le pourquoi.
packages_dir: "{{ playbook_dir | dirname }}/packages"
packages_default:
  - theatre_contrats
  - theatre_interfaces
  - dadou_utils_ros
# Anciens noms des packages renommés au lot L1e-2 (07/11, robot_* -> didier_*) et au
# lot L1e-3b (07/11, robot_interfaces -> theatre_interfaces), que
# la tâche de nettoyage du rôle synchronise efface de src/, build/ et install/ AVANT
# la copie. Pourquoi : le rsync n'efface rien — sans ce nettoyage, les anciens
# src/robot_* resteraient sur le Pi et `colcon build` (qui compile TOUT src/)
# compilerait anciens ET nouveaux (doublons, deux twist_deadman installés).
# Cette liste NE SE VIDE JAMAIS : un Pi resté éteint pendant des mois doit pouvoir
# rattraper au déploiement suivant (state=absent est sans effet si rien n'existe).
# Gravée par test_arborescence.py.
packages_retires:
  - robot_bringup
  - robot_description
  - robot_drive
  - robot_rehearsal
  - robot_sim
  - robot_web
  # L1e-3b : sans ce nettoyage, colcon compilerait les deux copies des messages
  # (même StringTime sous deux noms de package).
  - robot_interfaces
# Chemins (relatifs à ros2_ws/) de la lib partagée qui vivait EMBARQUÉE dans chaque projet
# (lien symbolique dépôt/dadou_utils_ros, copié par le rsync `copy_links` du projet entier)
# avant le lot L1e-3a (07/11) : elle est désormais le package src/dadou_utils_ros. La tâche
# `Remove ... embedded dadou_utils_ros` du rôle synchronise les efface AVANT la copie —
# le rsync n'efface rien : sans ça, colcon verrait deux copies de la lib (celle de
# src/robot/ ET le nouveau package) et l'ancienne pourrait masquer la neuve à l'import.
# Cette liste NE SE VIDE JAMAIS (un Pi resté éteint rattrape). Gravée par test_arborescence.py.
chemins_retires_lib:
  - src/robot/dadou_utils_ros
  - src/vision/dadou_utils_ros
  - src/controller/dadou_utils_ros
  # build/ et install/ des 3 packages qui EMBARQUAIENT la lib (find_packages la trouvait via
  # le symlink) : colcon ne nettoie jamais un install, la copie périmée de dadou_utils_ros y
  # resterait sur le PYTHONPATH et masquerait packages/dadou_utils_ros. Effacés → rebuild
  # complet de ces 3 packages au prochain démarrage (sentinelle). Ajouté le 07/11 (revue 3a).
  - build/robot
  - install/robot
  - build/vision
  - install/vision
  - build/controller
  - install/controller
# Lot « Ansible nickel » (07/11) : les entrées build/* et install/* ci-dessus ne sont plus
# effacées à CHAQUE passage (ce qui imposait la sentinelle et un rebuild complet) mais
# seulement si elles portent encore la forme ancienne — un dossier `dadou_utils_ros` à
# l'intérieur (détection dans le rôle synchronise). Les src/* restent effacés s'ils existent.

# Lot L1e-3c (07/11) : le cœur `robot` est devenu le package src/didier_core (liste `packages`
# de l'hôte robot). Chemins (relatifs à ros2_ws/) de l'ANCIENNE forme, que la tâche `Remove old
# robot package` du rôle synchronise efface AVANT la copie des packages — sans ça, colcon
# trouverait encore un package `robot` (src/robot/package.xml + setup.py, posés jadis par le
# rsync de conf/ros2/) et installerait deux fois les mêmes exécutables (wheels_node compris).
# Le rsync n'efface rien. Effacement CONDITIONNEL (même principe que chemins_retires_lib) : seule
# une entrée présente est touchée — src/robot/ n'en reçoit plus aucune, build/robot et
# install/robot n'ont plus de raison d'exister (aucun package `robot`). Les DONNÉES de src/robot/
# (json/, medias/, conf/, db/) ne sont PAS dans la liste. Elle NE SE VIDE JAMAIS (un Pi resté
# éteint rattrape). Gravée par test_arborescence.py.
chemins_retires_robot:
  - src/robot/robot
  - src/robot/dadou_utils_ros
  - src/robot/setup.py
  - src/robot/package.xml
  - src/robot/setup.cfg
  - src/robot/resource
  - src/robot/test
  - build/robot
  - install/robot
  # Ajout du déploiement du 08/11 (vécu) : src/robot/ n'étant PLUS un package, colcon descend
  # désormais dedans (il ne fouille jamais l'intérieur d'un package) et y a trouvé les restes
  # que le rsync du projet, sans --delete, n'avait jamais effacés — conf/ros2/{setup.py,
  # package.xml} (re-compilait `robot`) et conf/ros2_dependencies/robot_* (d'avant L1e-1,
  # re-compilait les six robot_*). Le dépôt ne les porte plus : effacés une fois, ils ne
  # reviennent pas. Les points de montage vides de conf/ros2/ (json/, medias/, robot/ créés
  # par Docker) ne sont pas listés : rsyncés depuis le PC, ils reviendraient à chaque passage.
  - src/robot/conf/ros2/setup.py
  - src/robot/conf/ros2/package.xml
  - src/robot/conf/ros2/setup.cfg
  - src/robot/conf/ros2/resource
  - src/robot/conf/ros2/test
  - src/robot/conf/ros2_dependencies
# Lot L1e-3d (08/11) : la vision est devenue le package src/didier_vision. Ancienne forme sur le
# Pi : le package `vision` à la racine de src/vision/ (module, descripteurs, launch et tests
# copiés à plat depuis conf/ros2/) et ses build/install. Les DONNÉES (conf, medias, mediamtx,
# db, tools) restent. Effacement conditionnel, avant la copie (même tâche que le cœur).
chemins_retires_vision:
  - src/vision/vision
  - src/vision/setup.py
  - src/vision/package.xml
  - src/vision/setup.cfg
  - src/vision/resource
  - src/vision/launch
  - src/vision/conftest.py
  - src/vision/pytest.ini
  - src/vision/conf/ros2
  - build/vision
  - install/vision

# Déchets que l'ancien rsync a poussés dans ros2_ws/src/<projet>/ (relevé du 07/11) : venv de
# test du PC (269 Mo robot, 342 Mo vision) et workspace colcon du banc x86 de la vision (50 Mo).
# Exclus du rsync désormais (rôle synchronise) ; cette liste efface ce qui est déjà sur le Pi.
# Comme les listes ci-dessus, elle ne se vide jamais (state=absent est sans effet si rien).
dechets_rsync:
  - .venv
  - conf/docker/x86/workspace
# Secrets (rôle secrets) : sur le PC seulement, hors dépôt et hors Nextcloud (chmod 600).
secrets_dir: "{{ lookup('env','HOME') }}/.config/didier"
#controller_project_dir: "dadou_controller_ros"
#utils_project_dir: "dadou_utils_ros_ros"
#deploy_dir: "robot_base"
conf_dir: "conf"
python_version: "python3.8"
ros2_ws: "ros2_ws"


# Depuis le lot L0 (2026-11-02) les déploiements partent du mono-dépôt theatre-robot, dossier legacy/
# (les anciens dépôts frères sont archivés). Depuis L1e-4c (11/11), robot et vision partent de
# machines/<machine>/ ; legacy/ ne sert plus qu'aux machines pas encore déménagées (télécommande).
# Lot « Ansible nickel » (07/11) : chemins DÉDUITS du playbook au lieu d'un chemin absolu vers le
# checkout principal — un worktree déploie SON arbre sans `-e local_projects_dir=… -e
# packages_dir=…` (surchargeables quand même par -e). Lot L1e-4a (08/11) : Ansible vit dans
# deploy/ à la racine du dépôt (ex legacy/dadou_utils_ros/ansible/) : un seul `dirname` mène
# à la racine, au lieu de deux (legacy/) et trois (packages/).
local_projects_dir: "{{ playbook_dir | dirname }}/legacy"
# Lot L1e-4c (11/11) : une machine = un dossier machines/<machine>/ (conf copiée dans
# src/<project_ros_dir>/conf/ du Pi + machine.yml, le CONTENU de la machine, chargé par
# `include_vars` en tête des playbooks d'après la variable `machine` de l'hôte dans hosts).
machines_dir: "{{ playbook_dir | dirname }}/machines"
# Racine du dépôt (L1e-4b) : le `git status` du sha déployé (rôle synchronise) s'y exécute, pour
# que les chemins de `chemins_deployes` ci-dessous soient relatifs à la racine.
depot_dir: "{{ playbook_dir | dirname }}"
# Chemins du dépôt (relatifs à sa racine) qui partent sur un Pi : SEULS eux décident du suffixe
# `-dirty` du sha publié par le robot (L1e-4b, 08/11). Avant : `git status` de TOUT le dépôt — une
# fumée en cours, qui écrit docs/fumee/journaux/ (non suivi), rendait le sha faussement « -dirty »
# et ecart-pi.sh rouge (vécu le 08/11 au soir). docs/ ne part sur aucun Pi. Gravée par
# test_arborescence.py ; un dossier nouvellement déployé s'ajoute ici. L1e-4c : machines/ remplace
# legacy/dadou_robot_ros/conf et legacy/dadou_vision_ros (plus rien n'en part sur un Pi).
chemins_deployes:
  - packages
  - data
  - machines
  - deploy
# Packages du mono-dépôt (rôle synchronise) : rsync vers ros2_ws/src/<package> de la
# machine. Liste PAR MACHINE : variable `packages` de l'hôte dans `hosts`, à défaut
# `packages_default` ci-dessous = les COMMUNS (lot L1a + dadou_utils_ros au lot L1e-3a),
# obligatoires partout (le shim utils_static.py importe theatre_contrats ; theatre_interfaces
# porte StringTime ; dadou_utils_ros est la lib partagée que tous les nodes importent —
# elle n'arrive plus par le symlink des 3 dépôts, supprimé en L1e-3a).
# Il n'y a plus de liste « sim-only à exclure » : un package sim-only (didier_jeu) n'est
# simplement dans la liste d'aucun hôte. Voir le commentaire du rôle pour le pourquoi.
packages_dir: "{{ playbook_dir | dirname }}/packages"
packages_default:
  - theatre_contrats
  - theatre_interfaces
  - dadou_utils_ros
# Anciens noms des packages renommés au lot L1e-2 (07/11, robot_* -> didier_*) et au
# lot L1e-3b (07/11, robot_interfaces -> theatre_interfaces), que
# la tâche de nettoyage du rôle synchronise efface de src/, build/ et install/ AVANT
# la copie. Pourquoi : le rsync n'efface rien — sans ce nettoyage, les anciens
# src/robot_* resteraient sur le Pi et `colcon build` (qui compile TOUT src/)
# compilerait anciens ET nouveaux (doublons, deux twist_deadman installés).
# Cette liste NE SE VIDE JAMAIS : un Pi resté éteint pendant des mois doit pouvoir
# rattraper au déploiement suivant (state=absent est sans effet si rien n'existe).
# Gravée par test_arborescence.py.
packages_retires:
  - robot_bringup
  - robot_description
  - robot_drive
  - robot_rehearsal
  - robot_sim
  - robot_web
  # L1e-3b : sans ce nettoyage, colcon compilerait les deux copies des messages
  # (même StringTime sous deux noms de package).
  - robot_interfaces
# Chemins (relatifs à ros2_ws/) de la lib partagée qui vivait EMBARQUÉE dans chaque projet
# (lien symbolique dépôt/dadou_utils_ros, copié par le rsync `copy_links` du projet entier)
# avant le lot L1e-3a (07/11) : elle est désormais le package src/dadou_utils_ros. La tâche
# `Remove ... embedded dadou_utils_ros` du rôle synchronise les efface AVANT la copie —
# le rsync n'efface rien : sans ça, colcon verrait deux copies de la lib (celle de
# src/robot/ ET le nouveau package) et l'ancienne pourrait masquer la neuve à l'import.
# Cette liste NE SE VIDE JAMAIS (un Pi resté éteint rattrape). Gravée par test_arborescence.py.
chemins_retires_lib:
  - src/robot/dadou_utils_ros
  - src/vision/dadou_utils_ros
  - src/controller/dadou_utils_ros
  # build/ et install/ des 3 packages qui EMBARQUAIENT la lib (find_packages la trouvait via
  # le symlink) : colcon ne nettoie jamais un install, la copie périmée de dadou_utils_ros y
  # resterait sur le PYTHONPATH et masquerait packages/dadou_utils_ros. Effacés → rebuild
  # complet de ces 3 packages au prochain démarrage (sentinelle). Ajouté le 07/11 (revue 3a).
  - build/robot
  - install/robot
  - build/vision
  - install/vision
  - build/controller
  - install/controller
# Lot « Ansible nickel » (07/11) : les entrées build/* et install/* ci-dessus ne sont plus
# effacées à CHAQUE passage (ce qui imposait la sentinelle et un rebuild complet) mais
# seulement si elles portent encore la forme ancienne — un dossier `dadou_utils_ros` à
# l'intérieur (détection dans le rôle synchronise). Les src/* restent effacés s'ils existent.

# Lot L1e-3c (07/11) : le cœur `robot` est devenu le package src/didier_core (liste `packages`
# de l'hôte robot). Chemins (relatifs à ros2_ws/) de l'ANCIENNE forme, que la tâche `Remove old
# robot package` du rôle synchronise efface AVANT la copie des packages — sans ça, colcon
# trouverait encore un package `robot` (src/robot/package.xml + setup.py, posés jadis par le
# rsync de conf/ros2/) et installerait deux fois les mêmes exécutables (wheels_node compris).
# Le rsync n'efface rien. Effacement CONDITIONNEL (même principe que chemins_retires_lib) : seule
# une entrée présente est touchée — src/robot/ n'en reçoit plus aucune, build/robot et
# install/robot n'ont plus de raison d'exister (aucun package `robot`). Les DONNÉES de src/robot/
# (json/, medias/, conf/, db/) ne sont PAS dans la liste. Elle NE SE VIDE JAMAIS (un Pi resté
# éteint rattrape). Gravée par test_arborescence.py.
chemins_retires_robot:
  - src/robot/robot
  - src/robot/dadou_utils_ros
  - src/robot/setup.py
  - src/robot/package.xml
  - src/robot/setup.cfg
  - src/robot/resource
  - src/robot/test
  - build/robot
  - install/robot
  # Ajout du déploiement du 08/11 (vécu) : src/robot/ n'étant PLUS un package, colcon descend
  # désormais dedans (il ne fouille jamais l'intérieur d'un package) et y a trouvé les restes
  # que le rsync du projet, sans --delete, n'avait jamais effacés — conf/ros2/{setup.py,
  # package.xml} (re-compilait `robot`) et conf/ros2_dependencies/robot_* (d'avant L1e-1,
  # re-compilait les six robot_*). Le dépôt ne les porte plus : effacés une fois, ils ne
  # reviennent pas. Les points de montage vides de conf/ros2/ (json/, medias/, robot/ créés
  # par Docker) ne sont pas listés : rsyncés depuis le PC, ils reviendraient à chaque passage.
  - src/robot/conf/ros2/setup.py
  - src/robot/conf/ros2/package.xml
  - src/robot/conf/ros2/setup.cfg
  - src/robot/conf/ros2/resource
  - src/robot/conf/ros2/test
  - src/robot/conf/ros2_dependencies
# Lot L1e-4b (08/11) : l'hôte robot ne reçoit plus le projet legacy/dadou_robot_ros/ ENTIER mais
# deux copies explicites (data/{json,medias,db} et conf/, rôle synchronise). Tout le reste, poussé
# par l'ancienne copie « projet » (docs 139 Mo, essais, firmware, CLAUDE.md, réglages d'éditeur…)
# ou par l'ancienne copie à plat de conf/ros2/ (launch.txt, puis conftest.py et pytest.ini d'avant
# L0), est un DÉCHET sur le Pi : relevé sur le robot le 08/11, effacé s'il est présent (même tâche
# conditionnelle que chemins_retires_robot). JAMAIS json/, medias/, db/ ni conf/ (gravé par
# test_arborescence.py). Rien ne les recrée plus ; la liste ne se vide jamais (un Pi resté éteint
# rattrape).
chemins_retires_legacy_robot:
  - src/robot/.claude
  - src/robot/.github
  - src/robot/.pytest_cache
  - src/robot/.vscode
  - src/robot/CLAUDE.md
  - src/robot/README.md
  - src/robot/ci
  - src/robot/ci_test
  - src/robot/conftest.py
  - src/robot/dadou_robot_ros.code-workspace
  - src/robot/docs
  - src/robot/essais
  - src/robot/firmware
  - src/robot/launch.txt
  - src/robot/pytest.ini
  - src/robot/requirements-test.txt
  - src/robot/requirements.txt
  - src/robot/todo.txt
# Lot L1e-3d (08/11) : la vision est devenue le package src/didier_vision. Ancienne forme sur le
# Pi : le package `vision` à la racine de src/vision/ (module, descripteurs, launch et tests
# copiés à plat depuis conf/ros2/) et ses build/install. Les DONNÉES (conf, medias, mediamtx,
# db, tools) restent. Effacement conditionnel, avant la copie (même tâche que le cœur).
chemins_retires_vision:
  - src/vision/vision
  - src/vision/setup.py
  - src/vision/package.xml
  - src/vision/setup.cfg
  - src/vision/resource
  - src/vision/launch
  - src/vision/conftest.py
  - src/vision/pytest.ini
  - src/vision/conf/ros2
  - build/vision
  - install/vision

# Lot L1e-4c (11/11) : la partie SIM de l'ancienne conf/ du robot (banc x86, scripts de la sim et
# de la fumée, minuterie) et le banc x86 de la vision vivent dans machines/sim/, qui ne part sur
# aucun Pi. Leurs copies poussées jadis par le rsync de conf/ (sans --delete) sont des DÉCHETS sur
# les Pi : effacées si présentes (même tâche conditionnelle que chemins_retires_robot). Rien ne les
# recrée (gravé par test_arborescence.py) ; la liste ne se vide jamais (un Pi resté éteint
# rattrape). validate-cmdvel-protocol.sh n'y est PAS : protocole caméra du robot, il reste.
chemins_retires_sim:
  - src/robot/conf/docker/sim
  - src/robot/conf/docker/x8664
  - src/robot/conf/scripts/coeurs_reserves.py
  - src/robot/conf/scripts/fumee.sh
  - src/robot/conf/scripts/fumee_page.py
  - src/robot/conf/scripts/launch-sim-in-docker.sh
  - src/robot/conf/scripts/pub.sh
  - src/robot/conf/scripts/validate-catalogue.sh
  - src/robot/conf/scripts/validate-jeu-a1.sh
  - src/robot/conf/scripts/validate-namespace.sh
  - src/robot/conf/scripts/validate-rehearsal-chantiers.sh
  - src/robot/conf/scripts/validate-rehearsal-faults.sh
  - src/robot/conf/scripts/validate-rehearsal-route.sh
  - src/robot/conf/systemd/didier-fumee.service
  - src/robot/conf/systemd/didier-fumee.timer
  - src/robot/conf/systemd/installer-fumee.sh
  - src/vision/conf/docker/x86
# Lot L1e-4c (11/11) : la vision ne reçoit plus le projet legacy/dadou_vision_ros/ ENTIER mais sa
# seule conf (machines/vision/ -> src/vision/conf/). Le reste, poussé par l'ancienne copie
# « projet », est un DÉCHET sur le Pi (relevé le 11/11) : docs, requirements, l'ancien outil tools/
# (désormais packages/didier_vision/tools/, arrivé avec le package), mediamtx/ (désormais
# src/vision/conf/mediamtx/ ; aucun consommateur sur le Pi), .github/ (CI morte). Effacé s'il
# est présent. JAMAIS conf/, medias/, db/ ni .dockerignore (ceinture de l'exclusion de
# conf/secret, voir machines/vision/docker/arm/Dockerfile-arm.dockerignore) — gravé par
# test_arborescence.py.
chemins_retires_legacy_vision:
  - src/vision/.github
  - src/vision/ARCHITECTURE.md
  - src/vision/CLAUDE.md
  - src/vision/README.md
  - src/vision/mediamtx
  - src/vision/requirements-test.txt
  - src/vision/requirements.txt
  - src/vision/tools
# Lot L2a (spec L2, décision 5) : un Dockerfile par machine, conf/docker/Dockerfile, construit
# avec le dossier conf/docker/ comme contexte principal. Les anciens fichiers, poussés jadis par
# le rsync de conf/ (sans --delete), resteraient sur les Pi : l'ancien Dockerfile-arm et son
# .dockerignore (vision), et les fichiers morts de l'ancienne conf docker du robot — dont
# conf/docker/.dockerignore, qui serait désormais LU (il est à la racine du nouveau contexte).
# Effacés s'ils sont présents (même tâche conditionnelle que chemins_retires_robot) ; rien ne les
# recrée (gravé par test_arborescence.py) ; la liste ne se vide jamais (un Pi resté éteint
# rattrape). JAMAIS conf/docker/Dockerfile, conf/docker/arm/ ni src/vision/conf/.dockerignore
# (verrou (a) du secret de la vision).
chemins_retires_l2:
  - src/robot/conf/docker/arm/Dockerfile-arm
  - src/robot/conf/docker/arm/.dockerignore
  - src/robot/conf/docker/.dockerignore
  - src/robot/conf/docker/Dockerfile-bak
  - src/robot/conf/docker/docker_bashrc
  - src/robot/conf/docker/jenkins
  - src/robot/conf/docker/scripts
  - src/vision/conf/docker/arm/Dockerfile-arm
  - src/vision/conf/docker/arm/Dockerfile-arm.dockerignore

# Déchets que l'ancien rsync a poussés dans ros2_ws/src/<projet>/ (relevé du 07/11) : venv de
# test du PC (269 Mo robot, 342 Mo vision) et workspace colcon du banc x86 de la vision (50 Mo).
# Exclus du rsync désormais (rôle synchronise) ; cette liste efface ce qui est déjà sur le Pi.
# Comme les listes ci-dessus, elle ne se vide jamais (state=absent est sans effet si rien).
dechets_rsync:
  - .venv
  - conf/docker/x86/workspace
  # Même déchet côté sim (workspace colcon de la fumée, 8 Mo trouvés sur le robot le 08/11) :
  # exclu de la copie depuis 965aaf4, effacé ici (L1e-4b).
  - conf/docker/sim/workspace
# Audios privés (14/11) : les sons de Didier vivent hors dépôt (dépôt public, chansons du commerce),
# dans <medias_prives_dir>/audios/ du PC, synchronisé par Nextcloud ; copiés sur le Pi robot dans
# src/robot/medias/audios/ par le rôle synchronise, vérifiés contre data/json/audios-prives.json.
# Même variable d'environnement et même défaut que la sim et les tests (theatre_contrats.donnees).
medias_prives_dir: "{{ lookup('env', 'DIDIER_MEDIAS_PRIVES') or (lookup('env', 'HOME') ~ '/Nextcloud/dev/didier/medias-prives') }}"
# Secrets (rôle secrets) : sur le PC seulement, hors dépôt et hors Nextcloud (chmod 600).
secrets_dir: "{{ lookup('env','HOME') }}/.config/didier"
#controller_project_dir: "dadou_controller_ros"
#utils_project_dir: "dadou_utils_ros_ros"
#deploy_dir: "robot_base"
conf_dir: "conf"
python_version: "python3.8"
ros2_ws: "ros2_ws"


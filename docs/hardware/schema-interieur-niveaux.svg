<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="sans-serif" font-size="13">
  <title>Didier — intérieur du torse en coupe, implantation proposée le 2026-11-06</title>
  <style>
    .pan { fill:#d9b27c; stroke:#7a5a2a; stroke-width:2 }
    .plaque { fill:#bfe3ff; stroke:#2a6ea8; stroke-width:2; fill-opacity:.7 }
    .bois { fill:#e8d2ad; stroke:#7a5a2a; stroke-width:2 }
    .tole { fill:#d66; stroke:#700; stroke-width:2; fill-opacity:.4 }
    .carte { fill:#2f6b3a; stroke:#143; stroke-width:1 }
    .boite { fill:#bbb; stroke:#555; stroke-width:1 }
    .colP { stroke:#d40000; stroke-width:5; fill:none }
    .colL { stroke:#1a5fd6; stroke-width:4; fill:none }
    .aud { stroke:#7a1fa2; stroke-width:3; fill:none; stroke-dasharray:6 4 }
    .conn { fill:#3c3; stroke:#060; stroke-width:1 }
    .lbl { fill:#222 } .small { font-size:11px; fill:#444 } .titre { font-size:16px; font-weight:bold }
  </style>
  <text x="20" y="24" class="titre">Coupe du torse (vue de côté, porte audio à droite) — implantation proposée</text>
  <text x="20" y="42" class="small">Rien n'est à l'échelle. Deux colonnes montantes dans les coins arrière : PUISSANCE (rouge) et LOGIQUE (bleu). L'audio (violet) ne passe que par la charnière.</text>

  <!-- pan arrière (gauche) et montant de porte (droite) -->
  <rect x="60" y="60" width="18" height="540" class="pan"/>
  <text x="30" y="330" class="small" transform="rotate(-90 30 330)">pan arrière (sapin 18)</text>
  <rect x="640" y="60" width="18" height="540" class="pan"/>
  <!-- porte -->
  <rect x="672" y="60" width="18" height="540" class="pan" fill-opacity=".5"/>
  <text x="700" y="90" class="lbl">porte audio (3 pans)</text>
  <text x="700" y="108" class="small">mixette, ampli, HP, isolateur</text>
  <circle cx="667" cy="330" r="7" fill="#444"/>
  <text x="700" y="334" class="small">charnière : faisceau audio en une gaine,</text>
  <text x="700" y="348" class="small">boucle de service + serre-câble de chaque côté</text>

  <!-- tablette blanche / cou -->
  <rect x="78" y="60" width="562" height="14" class="bois"/>
  <text x="90" y="56" class="small">tablette blanche — au-dessus : tambour de la bouche (ASME cou), tête, arceau (ReSpeaker)</text>

  <!-- ÉTAGE HAUT -->
  <rect x="96" y="160" width="530" height="7" class="plaque"/>
  <text x="100" y="152" class="lbl">ÉTAGE HAUT (plexi coulissant) — logique et sécurité</text>
  <rect x="150" y="128" width="90" height="12" class="carte"/><rect x="150" y="142" width="90" height="12" class="carte"/>
  <text x="250" y="139" class="small">pile Puissance sur Sécurité (100×100), nappe GPIO par une lumière</text>
  <rect x="330" y="172" width="120" height="30" class="boite"/>
  <text x="330" y="222" class="small">Pi 4 + Pi 5 sur traîneaux SOUS la plaque (≥ 45 mm libres), poignées côté porte</text>
  <rect x="612" y="150" width="12" height="18" class="conn"/>
  <text x="520" y="214" class="small" text-anchor="end">connecteurs fixes au bord</text>

  <!-- ÉTAGE MILIEU -->
  <rect x="96" y="290" width="530" height="7" class="plaque"/>
  <text x="100" y="282" class="lbl">ÉTAGE MILIEU (plexi coulissant) — audio et modules</text>
  <rect x="140" y="268" width="90" height="12" class="carte"/>
  <text x="140" y="262" class="small">carte Audio</text>
  <rect x="260" y="268" width="90" height="12" class="carte"/>
  <text x="260" y="262" class="small">carte Moteurs (PCA9685 ×2, PCF)</text>
  <rect x="612" y="280" width="12" height="18" class="conn"/>
  <text x="380" y="316" class="small">sur les pans, debout : VoiceTone C1, récepteur BLX4 (pas sur la plaque)</text>

  <!-- COFFRE DES ALIMS -->
  <rect x="78" y="430" width="562" height="12" class="bois"/>
  <text x="100" y="340" class="lbl">COFFRE DES ALIMS — conversion, distribution, réseau, odométrie</text>
  <rect x="110" y="352" width="22" height="70" class="boite"/><rect x="136" y="352" width="22" height="70" class="boite"/>
  <rect x="162" y="352" width="22" height="70" class="boite"/><rect x="190" y="352" width="30" height="78" class="boite"/>
  <text x="110" y="412" class="small" transform="rotate(-90 110 412)"></text>
  <text x="230" y="368" class="small">4 convertisseurs debout sur les pans (38 mm de large chacun) :</text>
  <text x="230" y="382" class="small">SD-50B-5 ×2, SD-50B-12, SD-150B-12 (audio, près de la charnière)</text>
  <rect x="420" y="352" width="60" height="40" class="boite"/>
  <text x="420" y="406" class="small">bloc 24 V : fusibles + barre de MASSE (étoile)</text>
  <rect x="520" y="352" width="70" height="30" class="boite"/>
  <text x="520" y="396" class="small">routeur (2 RJ45)</text>
  <rect x="520" y="400" width="50" height="22" class="carte"/>
  <text x="575" y="416" class="small">carte Odométrie</text>
  <text x="100" y="458" class="small">plancher du coffre : 2 passe-fils (colonnes) + 1 passe-fil capteurs d'odométrie, avec œillets</text>

  <!-- CAISSE BASSE -->
  <rect x="78" y="470" width="562" height="130" class="tole"/>
  <text x="100" y="490" class="lbl">CAISSE BASSE (tôle) — 24 V et moteurs seulement</text>
  <rect x="110" y="505" width="140" height="70" class="boite"/>
  <text x="115" y="545" class="small">pack 18650 + BMS</text>
  <text x="115" y="560" class="small">sur tiroir, extractible</text>
  <rect x="270" y="505" width="50" height="30" class="boite"/>
  <text x="270" y="550" class="small">fusible gén.</text>
  <rect x="330" y="505" width="50" height="30" class="boite"/>
  <text x="330" y="550" class="small">relais 40 A</text>
  <rect x="400" y="505" width="60" height="60" class="carte"/><rect x="470" y="505" width="60" height="60" class="carte"/>
  <text x="400" y="582" class="small">SmartDrive40 ×2 (câble blindé)</text>
  <rect x="550" y="505" width="80" height="40" class="boite"/>
  <text x="550" y="562" class="small">chargeur Victron fixé,</text>
  <text x="550" y="576" class="small">prise de charge en panneau</text>

  <!-- colonnes montantes -->
  <path class="colP" d="M 300 520 L 300 470 L 100 470 L 100 74"/>
  <text x="104" y="100" class="small" fill="#d40000">colonne PUISSANCE : 24 V bras/cou, 12 V, 5 V, LED, tronc J20</text>
  <path class="colL" d="M 350 520 L 350 480 L 120 480 L 120 74"/>
  <text x="124" y="114" class="small" fill="#1a5fd6">colonne LOGIQUE : relais 40 A, coup-de-poing, PWM SmartDrive, servos, USB, réseau</text>
  <path class="aud" d="M 200 352 L 600 352 L 600 330 L 660 330"/>
  <text x="400" y="344" class="small" fill="#7a1fa2">12 V audio + signal → charnière → porte</text>

  <!-- légende -->
  <rect x="700" y="420" width="180" height="150" fill="#fff" stroke="#999"/>
  <text x="710" y="440" class="lbl">Légende</text>
  <rect x="710" y="450" width="20" height="6" class="plaque"/><text x="736" y="457" class="small">plaque plexi, rails sur les 2 pans latéraux</text>
  <rect x="710" y="468" width="20" height="8" class="carte"/><text x="736" y="476" class="small">carte 100 × 100 (entretoises M3)</text>
  <rect x="710" y="486" width="20" height="8" class="boite"/><text x="736" y="494" class="small">appareil fixé par support</text>
  <rect x="710" y="504" width="10" height="12" class="conn"/><text x="736" y="513" class="small">connecteur fixe au bord, côté porte</text>
  <line x1="710" y1="530" x2="730" y2="530" class="colP"/><text x="736" y="534" class="small">colonne puissance</text>
  <line x1="710" y1="548" x2="730" y2="548" class="colL"/><text x="736" y="552" class="small">colonne logique</text>
  <line x1="710" y1="564" x2="730" y2="564" class="aud"/><text x="736" y="568" class="small">audio (par la charnière seulement)</text>
  <text x="20" y="625" class="small">Rails et connecteurs de bord : pour sortir un étage, on débranche au bord côté porte et on tire. Les colonnes passent dans des encoches aux coins arrière et ne touchent pas la plaque.</text>
</svg>

services:
  dadou-robot:
    container_name: dadou-robot-container
    image: dadouuu/dadou-robot-arm:latest
    build:
      # L2a (spec L2, décision 5) : le Dockerfile unique de la machine (ARM et x86) est
      # src/robot/conf/docker/Dockerfile ; contexte principal = son dossier (rien n'en est copié),
      # tout le reste en contextes NOMMÉS ci-dessous, chemins de la disposition du Pi.
      context: ..
      dockerfile: Dockerfile
      # Packages COMMUNS du mono-dépôt (lot L1a) en contextes NOMMÉS. Chemins
      # de l'arborescence DÉPLOYÉE sur le Pi (ros2_ws/src/<package>, même
      # convention que le volume theatre_interfaces ci-dessous) — ⚠️ Ansible
      # doit y synchroniser packages/theatre_interfaces et packages/theatre_contrats
      # AVANT tout déploiement de ce lot (verrou noté au tableau de bord).
      additional_contexts:
        theatre_interfaces: ../../../../theatre_interfaces
        theatre_contrats: ../../../../theatre_contrats
        # L1e-3a : la lib partagée, package de packages/ (liste `packages_default`).
        dadou_utils_ros: ../../../../dadou_utils_ros
        # L1e-3c : le cœur, package de packages/ (liste `packages` de l'hôte robot).
        didier_core: ../../../../didier_core
        # L1e-1 : les 6 packages du robot, eux aussi dans ros2_ws/src/<package> (liste
        # `packages` de l'hôte robot dans ansible/hosts) — remplace l'ancienne COPY du dossier conf/ du robot.
        didier_bringup: ../../../../didier_bringup
        didier_description: ../../../../didier_description
        didier_drive: ../../../../didier_drive
        didier_rehearsal: ../../../../didier_rehearsal
        didier_sim: ../../../../didier_sim
        didier_web: ../../../../didier_web
        # L1e-4b : données du robot (Dockerfile : COPY --from=data). Dans le dépôt elles
        # vivent dans data/ ; sur le Pi, Ansible les copie dans src/robot/{json,medias,db}
        # (chemin Pi INCHANGÉ), c'est-à-dire ../../.. d'ici — les montages json/ et medias/
        # ci-dessous restent donc ../../../json et ../../../medias (disposition du Pi).
        data: ../../..
        # L2a : la conf de la machine (machines/robot/ du dépôt), src/robot/conf/ sur le Pi.
        conf: ../..
    # Supervision par le DÉMON Docker (assainissement 2026-07-11) : relance
    # sur crash et au boot, sauf arrêt volontaire (docker stop / systemctl
    # stop robot). robot.service n'est plus qu'un interrupteur up -d / stop —
    # plus de client compose attaché qui devient orphelin au premier recreate.
    restart: unless-stopped
    environment:
      #- DISPLAY=${DISPLAY}
      - ALSA_CARD=0
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      # Nom du robot = namespace ROS ABSOLU de tous les nœuds (lot L1b) : /didier/…
      # par défaut. Robot, vision et télécommande d'un même Didier DOIVENT avoir le
      # même nom (sinon ils ne s'entendent plus) ; la CLI ros2 doit préfixer.
      - ROBOT_NAME=${ROBOT_NAME:-didier}
      # Racine des DONNÉES du cœur (json/, medias/, db/, conf/), lue par robot_config.py
      # (L1e-3c) : le code est dans src/didier_core, les données restent sous src/robot/.
      - DIDIER_DATA_DIR=/home/ros2_ws/src/robot/
      # Édition des données à travers le robot (L1d) : écrivain data_edit_node + éditeur de la
      # page scène, lus par robot_app.launch.py. Posée par Ansible depuis `edition_donnees` du
      # machine.yml (FAUX dans le dépôt, décision de David) ; absente = faux.
      - DATA_EDIT=${DATA_EDIT:-false}
    #ports:
    #  - "80:80"
    #  - "8000-9000:8000-9000"
    network_mode: "host"

    volumes:
      #- /tmp/.X11-unix:/tmp/.X11-unix
      - ../../../conf:/home/ros2_ws/src/robot/conf
      - ../../../json:/home/ros2_ws/src/robot/json
      - ../../../medias:/home/ros2_ws/src/robot/medias
      - ../../../../didier_bringup:/home/ros2_ws/src/didier_bringup
      - ../../../../theatre_interfaces:/home/ros2_ws/src/theatre_interfaces
      # theatre_contrats (lot L1a) : importé par dadou_utils_ros/utils_static.py
      # — sans lui, TOUS les nodes tombent à l'import, wheels_node compris.
      - ../../../../theatre_contrats:/home/ros2_ws/src/theatre_contrats
      # dadou_utils_ros (L1e-3a) : package à plat dans src/ comme les autres (plus de
      # copie dans src/robot/, le symlink a disparu).
      - ../../../../dadou_utils_ros:/home/ros2_ws/src/dadou_utils_ros
      # didier_core (L1e-3c) : le cœur (ex-package robot), à plat dans src/ ; sa sentinelle de
      # build est src/didier_core/change (launch-ros-in-docker.sh).
      - ../../../../didier_core:/home/ros2_ws/src/didier_core
      # Chaîne cmd_vel (bridge/mux/deadman) — rsyncée sur le Pi par la tâche
      # ansible (liste `packages` de l'hôte robot -> src/), comme didier_bringup/theatre_interfaces.
      - ../../../../didier_drive:/home/ros2_ws/src/didier_drive
      # Pont web (console navigateur, contenus/supervision — drive_enabled
      # reste false sur le robot, cf. robot_app.launch.py). Même mécanique de
      # rsync que didier_drive.
      - ../../../../didier_web:/home/ros2_ws/src/didier_web
      # L2a (décision 5 : contextes nommés = montages de sources = liste `packages`) : les trois
      # packages de la liste qui n'étaient pas montés — le conteneur compilait la copie de
      # l'IMAGE, pas celle rsyncée par Ansible. Aucun nœud du bringup n'en vient.
      - ../../../../didier_description:/home/ros2_ws/src/didier_description
      - ../../../../didier_rehearsal:/home/ros2_ws/src/didier_rehearsal
      - ../../../../didier_sim:/home/ros2_ws/src/didier_sim
      - ../../../../../build:/home/ros2_ws/build
      - ../../../../../install:/home/ros2_ws/install
      - ../../../../../log:/home/ros2_ws/log
      - /dev:/dev
      - /dev/snd:/dev/snd
    #  - /dev/null:/folder/fileToBeExcluded
    #accès device ACMO gpio serial by id disque etc ...
    privileged: true
 #   devices:
 #    - /dev

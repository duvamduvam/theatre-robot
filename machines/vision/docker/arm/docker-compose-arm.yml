services:
  dadou-vision:
    container_name: dadou-vision-container
    image: dadouuu/dadou-vision-arm:latest
    build:
      # L2a (spec L2, décision 5) : le Dockerfile unique de la machine (ARM et x86) est
      # src/vision/conf/docker/Dockerfile ; contexte principal = son dossier (rien n'en est copié),
      # tout le reste en contextes NOMMÉS ci-dessous, chemins de la disposition du Pi.
      context: ..
      dockerfile: Dockerfile
      # Packages COMMUNS du mono-dépôt (lot L1a) en contextes NOMMÉS, chemins
      # de l'arborescence déployée sur le Pi (ros2_ws/src/<package>, comme le
      # volume theatre_interfaces) — Ansible doit les y synchroniser.
      additional_contexts:
        theatre_interfaces: ../../../../theatre_interfaces
        theatre_contrats: ../../../../theatre_contrats
        dadou_utils_ros: ../../../../dadou_utils_ros
        didier_vision: ../../../../didier_vision
        # L2a : la conf de la machine (machines/vision/ du dépôt), src/vision/conf/ sur le Pi.
        # Son .dockerignore (à sa racine) exclut `secret` (décision 6, verrou (a)).
        conf: ../..
    environment:
      - ALSA_CARD=0
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      # Nom du robot = namespace ROS ABSOLU de tous les nœuds (lot L1b) : /didier/…
      # par défaut. Robot, vision et télécommande d'un même Didier DOIVENT avoir le
      # même nom (sinon ils ne s'entendent plus) ; la CLI ros2 doit préfixer.
      - ROBOT_NAME=${ROBOT_NAME:-didier}
      # Racine des DONNÉES (conf/, medias/, db/ ; lot L1e-3d) lue par vision_config.py : le
      # code est le package src/didier_vision, les données restent sous src/vision/. Valeur
      # = le défaut du code, posée ici pour que le contrat soit lisible.
      - DIDIER_VISION_DATA_DIR=/home/ros2_ws/src/vision/
    network_mode: "host"

    # Chemins RELATIFS au fichier compose (pattern du parc, cf. dadou_robot_ros) :
    # portables PC/Pi quel que soit le point de montage du dépôt. La leçon
    # « pas de ~ sous sudo » ne concerne que ~, pas les relatifs — compose les
    # résout par rapport à CE fichier, pas au répertoire d'appel.
    volumes:
      - ../../../conf:/home/ros2_ws/src/vision/conf
      - ../../../medias:/home/ros2_ws/src/vision/medias
      # theatre_interfaces (StringTime...) arrive par rsync ansible au niveau
      # src/, comme sur les autres machines du parc — pas encore utilisé par
      # le heartbeat V0, prêt pour /face /audio en V2.
      - ../../../../theatre_interfaces:/home/ros2_ws/src/theatre_interfaces
      # theatre_contrats (lot L1a) : même mécanique (rsync ansible au niveau
      # src/) — importé par dadou_utils_ros/utils_static.py, OBLIGATOIRE.
      - ../../../../theatre_contrats:/home/ros2_ws/src/theatre_contrats
      # dadou_utils_ros (L1e-3a) : lib partagée, package à plat dans src/ (rsync ansible,
      # liste `packages_default`) — plus de copie dans src/vision/.
      - ../../../../dadou_utils_ros:/home/ros2_ws/src/dadou_utils_ros
      # Workspace colcon partagé entre les dépôts dadou_*_ros (comme robot).
      - ../../../../../build:/home/ros2_ws/build
      - ../../../../../install:/home/ros2_ws/install
      - ../../../../../log:/home/ros2_ws/log
      # didier_vision (L1e-3d) : le code (module, package.xml, setup.py, launch/) est un
      # package de packages/, à plat dans src/ comme les autres (rsync ansible, liste `packages`
      # de l'hôte) ; édition à chaud + sentinelle src/didier_vision/change -> colcon build.
      - ../../../../didier_vision:/home/ros2_ws/src/didier_vision
      - /dev:/dev
      # Audio (TTS, pas encore utilisé par le heartbeat V0, prêt pour V2).
      - /dev/snd:/dev/snd
      # Alias ALSA casque_mic/mixette (vision_config.py chat_mic_device/
      # chat_out_device) : définis dans /etc/asound.conf de L'HÔTE (Pi 5),
      # versionné depuis le 07/11 dans conf/rpi/asound.conf et posé par Ansible
      # (rôle config-hote ; alias par NOM de carte, indépendants de l'ordre USB)
      # — montage read-only, jamais écrit depuis le conteneur.
      - /etc/asound.conf:/etc/asound.conf:ro
    privileged: true

# Banc PC « Didier à l'arrêt » (2026-09-13, spec L2 décision 14) : perception + parole RÉELLES sur
# le PC de dev (webcam USB + carte son / casque), corps SIMULÉ dans Gazebo. SURCOUCHE du compose de
# la sim, appliquée au MÊME service `vision` (même Dockerfile que le Pi 5) :
#
#   cd machines/sim
#   docker compose -f docker-compose.yml -f docker-compose.banc.yml up -d
#   CHAT=true docker compose -f docker-compose.yml -f docker-compose.banc.yml up -d vision
#
# SEULE exception à la décision 8 (aucun service privilégié ni /dev) : la webcam (/dev/video0,
# person_tracker) et l'audio l'exigent. Domaine 43 inchangé (posé en littéral par le compose de base).
# Le secret de ~/.config/didier/ est monté ICI seulement, en lecture seule — jamais dans l'image.
# Ex banc x86 de la vision (supprimé en L2b) ; asound-pc.conf et
# audio_banc.py restent dans banc-vision/.
services:
  vision:
    environment:
      # chat_node (micro → whisper → LLM → piper) : OFF par défaut, même prudence que sur le Pi
      # (micro physique + budget LLM payant). Activation explicite : CHAT=true docker compose … up.
      - CHAT=${CHAT:-false}
      # Audio par PIPEWIRE et non par les cartes ALSA (le casque du banc est en Bluetooth : aucune
      # carte ALSA ne le représente, cf. banc-vision/asound-pc.conf). Socket de la session, plus bas.
      - PULSE_SERVER=unix:/run/pulse/native
      # Facteur VAD du BANC (vision_config.vad_config_from_env) : 6 pour le micro du casque BT, dont
      # le bruit de fond fluctue (mesuré le 22/10). Vide = défaut 1,3 du robot.
      - CHAT_VAD_FACTOR=${CHAT_VAD_FACTOR:-6}
      # Partenaire de scène que Didier CONNAÎT (personas.PARTNER_TEMPLATE) : au banc, la personne au
      # casque est David. Jamais posé sur le Pi. Vide = aucun partenaire.
      - CHAT_PARTENAIRE=${CHAT_PARTENAIRE:-David}
      # Micro de CONFIANCE (08/11, vision_config.trusted_mic_from_env) : au casque, la personne au
      # micro est David par construction. Domaine 43 seulement.
      - CHAT_MICRO_CONFIANCE=${CHAT_MICRO_CONFIANCE:-true}
      # Modèle whisper du BANC : « small » (« base » confondait chien/chat, 22/10). Le Pi reste en « base ».
      - CHAT_WHISPER_MODEL=${CHAT_WHISPER_MODEL:-small}
      # Mouvement à la voix (lot I1) : « go »/« stop » au régisseur de la répétition. BANC SEULEMENT.
      - CHAT_MOUVEMENT=${CHAT_MOUVEMENT:-true}
      # Metteur en scène intérieur (reflection_node + chat_node branché dessus). Coût LLM en plus.
      - CHAT_REFLEXION=${CHAT_REFLEXION:-true}
      # Modèle LLM de la bouche : vide = défaut de config (liste fermée, vision_config.llm_model_from_env).
      - CHAT_LLM_MODEL=${CHAT_LLM_MODEL:-}
      # Caméra Gazebo proposée à chaud EN PLUS de la webcam (qui reste la source par défaut).
      - VISION_SIM_CAMERA_TOPIC=${VISION_SIM_CAMERA_TOPIC:-camera/image_raw}
    volumes:
      # La conf complète de la machine (comme sur le Pi) ; le secret est monté par-dessus.
      - ../vision:/home/ros2_ws/src/vision/conf
      # Secret du banc : source unique ~/.config/didier/ (la même que le rôle secrets pose sur le
      # Pi). Sans lui chat_node meurt au démarrage (« Secret manquant »). Lecture seule.
      - ${HOME}/.config/didier/vision-conf-secret:/home/ros2_ws/src/vision/conf/secret:ro
      # Clé de l'API Anthropic (16/11) : la tête parle à Claude en direct, OpenRouter en secours.
      # Même source que le rôle secrets sur le Pi, même chemin dans le conteneur.
      - ${HOME}/.config/didier/secrets.env:/run/secrets/didier.env:ro
      # Alias ALSA casque_mic/mixette du BANC (mêmes noms que sur le Pi 5, pointés sur la carte son
      # du PC) : le code tourne sans changer un seul paramètre. L'hôte n'est pas touché.
      - ./banc-vision/asound-pc.conf:/etc/asound.conf:ro
      # Socket PipeWire de la session hôte (uid 1000) : micro ET sortie du casque Bluetooth.
      # ⚠️ La session graphique doit être ouverte : pas de PipeWire, pas de son.
      - /run/user/1000/pulse:/run/pulse:ro
      # Webcam (/dev/video0, person_tracker) + audio (/dev/snd, chat).
      - /dev:/dev
    privileged: true

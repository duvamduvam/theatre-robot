# Compose stack for the desktop-enabled robot application.
services:
  dadou-robot:
    container_name: dadou-robot-container
    image: dadouuu/dadou-robot-x86:latest
    build:
      # L1e-4c (11/11) : banc dans machines/sim/banc-robot/ ; le contexte principal est ce
      # dossier, tout le reste arrive en contextes NOMMÉS (../../../ = racine theatre-robot).
      context: .
      dockerfile: Dockerfile-x86
      additional_contexts:
        # L1e-4c : la conf de la machine robot (ex legacy/dadou_robot_ros/conf/), copiée en
        # src/robot/conf/ comme sur le Pi.
        conf: ../../robot
        theatre_interfaces: ../../../packages/theatre_interfaces
        theatre_contrats: ../../../packages/theatre_contrats
        # L1e-3a : la lib partagée, package de packages/.
        dadou_utils_ros: ../../../packages/dadou_utils_ros
        # L1e-3c : le cœur (ex-package robot).
        didier_core: ../../../packages/didier_core
        # L1e-1 : les 6 packages ROS autonomes (ex-conf/ du robot).
        didier_bringup: ../../../packages/didier_bringup
        didier_description: ../../../packages/didier_description
        didier_drive: ../../../packages/didier_drive
        didier_rehearsal: ../../../packages/didier_rehearsal
        didier_sim: ../../../packages/didier_sim
        didier_web: ../../../packages/didier_web
        # L1e-4b : les données du robot (json/, medias/, db/) vivent dans data/ du mono-dépôt.
        data: ../../../data
    environment:
      # Allow RViz et al to display on host X server.
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=${XAUTHORITY:-/tmp/.docker.xauth}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      # Nom du robot = namespace ROS ABSOLU de tous les nœuds (lot L1b) : /didier/…
      # par défaut. Robot, vision et télécommande d'un même Didier DOIVENT avoir le
      # même nom (sinon ils ne s'entendent plus) ; la CLI ros2 doit préfixer.
      - ROBOT_NAME=${ROBOT_NAME:-didier}
      # Racine des données du cœur (L1e-3c) : json/medias/conf restent sous src/robot/.
      - DIDIER_DATA_DIR=/home/ros2_ws/src/robot/
    network_mode: "host"
    volumes:
      # Sync configs, assets, and give access to host X11 + logs.
      - ../../robot:/home/ros2_ws/src/robot/conf
      - ../../../data/json:/home/ros2_ws/src/robot/json
      - ../../../data/medias:/home/ros2_ws/src/robot/medias
      # Audios privés (14/11) : hors dépôt, montés en lecture seule à leur place (même montage
      # que docker-compose-sim.yml).
      - ${DIDIER_MEDIAS_PRIVES:-${HOME}/Nextcloud/dev/didier/medias-prives}/audios:/home/ros2_ws/src/robot/medias/audios:ro
      - ../../../packages/didier_bringup:/home/ros2_ws/src/didier_bringup
      - ../../../packages/theatre_interfaces:/home/ros2_ws/src/theatre_interfaces
      - ../../../packages/theatre_contrats:/home/ros2_ws/src/theatre_contrats
      - ../../../packages/dadou_utils_ros:/home/ros2_ws/src/dadou_utils_ros
      - ../../../packages/didier_core:/home/ros2_ws/src/didier_core
      - /home/dadou/log:/home/ros2_ws/log
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/tmp/.docker.xauth}:${XAUTHORITY:-/tmp/.docker.xauth}:rw
    #  - /dev/:/dev
    #  - /dev/null:/folder/fileToBeExcluded
    #accès device ACMO gpio serial by id disque etc ...
    privileged: true
 #   devices:
 #    - /devœœ

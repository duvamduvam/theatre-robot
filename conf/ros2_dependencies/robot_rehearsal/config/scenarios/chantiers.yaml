# Scénario « chantiers » (lot R3, étude §13.5) : 20 bugs RÉELS à instants
# tirés (graine) + 30 lubies déclenchées devant les objets du chemin.
# À lancer avec l'itinéraire du même nom :
#   ros2 launch robot_rehearsal rehearsal.launch.py route:=chantiers scenario:=chantiers
#
# Lecture scénique (étude §2, §13) — David ignore le tirage, le journal le dit après :
# liaison -> perte de liaison, deadman ; arret_net -> arrêt franc ; pause_syndicale
# -> il continue sur sa dernière consigne (« deux signaux ») ; acoups -> WiFi saturé ;
# retard -> réagit en retard ; batterie -> ralentit ; fader_mort -> s'arrête, le
# fader ne répond plus ; emballement -> à fond (plafond 0,5 m/s inchangé) ;
# visage_fige / ruban_noir / bras_en_greve / sequence_bloquee / regard_fige ->
# le corps se fige par morceaux ; reboot -> black-out puis il repart ;
# reboot_sans_reprise -> black-out, il ne repart PAS (relance expirée, vécu
# 08/10) ; latence_pi -> 6 s de silence avant chaque réponse ; contresens ->
# il comprend autre chose (whisper qui hallucine) ; sourd -> il n'entend plus ;
# muet -> il « parle » sans voix ; parle_au_bus -> il répond au trafic.
# Lubies (p 0.4 -> ~12 par séance) : devant l'objet, la consigne du POI part au
# chat et Didier s'arrête (route_speed 0) jusqu'à 60 s ; David le relance au
# fader / à la télécommande ou attend. Une lubie et un bug `speed` ne se
# chevauchent pas (cible commune : le second est sauté). La Titan grise est
# toujours tirée (p 1.0, 90 s) : c'est le final.
# 900 s : le trajet à 50 % (§13.2) prend ~10 min SANS arrêt ; chaque lubie
# laissée expirer ajoute jusqu'à 60 s. Si la séance finit avant la Titan, les
# déclencheurs restants passent « skipped » (le journal le dit) — David ferme
# ses lubies au fader ou monte la vitesse.
name: chantiers
seed: 0
duration_s: 900
faults:
  # --- les 20 bugs (§13.5), dans l'ordre du tableau ---------------------------
  - {id: liaison,             type: pause, t: random, duration_s: 5,  process: route_driver}
  - {id: arret_net,           type: relay, t: random, duration_s: 6,  relay: cmd_vel_follow, op: zero}
  - {id: pause_syndicale,     type: relay, t: random, duration_s: 4,  relay: cmd_vel_follow, op: freeze}
  - {id: acoups,              type: relay, t: random, duration_s: 10, relay: cmd_vel_follow, op: drop, p: 0.7}
  - {id: retard,              type: relay, t: random, duration_s: 10, relay: cmd_vel_follow, op: delay, delay_ms: 1500}
  - {id: batterie,            type: speed, t: random, duration_s: 20, value: 0.4}
  - {id: fader_mort,          type: speed, t: random, duration_s: 8,  value: 0.0}
  - {id: emballement,         type: speed, t: random, duration_s: 6,  value: 1.0}
  - {id: visage_fige,         type: pause, t: random, duration_s: 6,  process: face_sim}
  - {id: ruban_noir,          type: pause, t: random, duration_s: 6,  process: leds_sim_node}
  - {id: bras_en_greve,       type: pause, t: random, duration_s: 8,  process: servos_sim_node}
  - {id: sequence_bloquee,    type: pause, t: random, duration_s: 8,  process: animations_node}
  - {id: regard_fige,         type: pause, t: random, duration_s: 8,  process: gaze_follower}
  - {id: reboot,              type: kill,  t: random, process: route_driver, reenable: true}
  - {id: reboot_sans_reprise, type: kill,  t: random, process: route_driver, reenable: false}
  - {id: latence_pi,          type: chat,  t: random, duration_s: 40, op: delay, params: {delay_ms: 6000}}
  - {id: contresens,          type: chat,  t: random, duration_s: 30, op: garble}
  - {id: sourd,               type: chat,  t: random, duration_s: 20, op: deaf}
  - {id: muet,                type: chat,  t: random, duration_s: 20, op: mute}
  - {id: parle_au_bus,        type: chat,  t: random, op: phantom, params: {text: "Sous-titres réalisés par la communauté d'Amara.org"}}
  # --- les 30 lubies (§13.3), dans l'ordre de la marche ; texte = champ `lubie` du POI ---

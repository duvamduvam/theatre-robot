# Alias ALSA du banc PC — monté par docker-compose-x86.yml sur
# /etc/asound.conf DU CONTENEUR (l'hôte n'est jamais modifié).
#
# Mêmes NOMS d'alias que sur le Pi 5 (casque_mic / mixette, cf.
# vision_config.py chat_mic_device/chat_out_device) : le code de prod tourne
# sans qu'aucun paramètre ne change — seule la cible diffère.
#
# ── ENTRÉE : le ReSpeaker XVF3800, c'est-à-dire LE MICRO DU ROBOT ──────────
# Branché sur le PC le 2026-09-13 (le robot est hors tension depuis
# l'incident du 12/09). C'est ce qui rend le banc REPRÉSENTATIF : la chaîne
# d'acquisition du banc devient celle du robot, donc les seuils du gate
# « source audio vivante » (2800 = milieu géométrique mesuré SUR CETTE
# chaîne) reprennent leur sens. Un casque Bluetooth, lui, mettait le simple
# bruit de pièce à 3000-9000 et faisait bloquer le gate en boucle — c'est le
# piège payé ce jour-là.
#
# `hw` et PAS `pulse` : le Pi attaque sa carte en direct, on fait pareil —
# aucun rééchantillonnage ni correction automatique de gain de PipeWire ne
# doit s'intercaler, sans quoi on ne mesure plus la même chose que le robot.
# Le XVF3800 n'annonce QU'UN seul format (S16_LE / 16000 / 2 ch) : `plug` ne
# sert donc qu'au mixage 2 voies -> 1 voie demandé par vision/audio/mic.py.
#
# ⚠️ Mixage des DEUX canaux, volontairement : la fiche matériel
# (dadou_robot_ros/docs/hardware/overview.md) a établi que ce sont deux
# signaux DISTINCTS (corrélation 0,95 à 0 échantillon de décalage, ~2 dB
# d'écart) et que l'on ignore encore lequel porte le faisceau traité. Elle
# prescrit explicitement de rester sur un mixage tant que la question n'est
# pas tranchée — ne PAS câbler l'ASR sur un canal fixe au hasard.
#
# Adressage PAR NOM de carte (« Array ») et jamais par numéro : les numéros
# bougent au branchement (leçon du Pi 5).
pcm.casque_mic {
    type plug
    slave.pcm "hw:Array"
}
ctl.casque_mic {
    type hw
    card "Array"
}

# ── SORTIE : casque de retour Bluetooth (Sony WH-1000XM4) ─────────────────
# Un casque de retour, et pas une enceinte, ÉVITE la boucle acoustique : le
# ReSpeaker ne réentend pas Didier, donc le gate anti-larsen n'a pas à
# travailler. Sur le robot réel c'est l'inverse (le châssis EST l'enceinte,
# cf. overview.md §Echo) — cette séance ne teste donc PAS le half-duplex.
#
# Le Bluetooth n'existe pas comme carte ALSA : il n'est servi que par
# PipeWire côté hôte -> plugin `type pulse` (libasound2-plugins, cf.
# conf/packages-docker.txt) + socket montée par le compose (PULSE_SERVER).
# Nœud nommé par ADRESSE MAC : une séance de mesure ne doit pas changer de
# sortie parce que quelqu'un a connecté un casque ailleurs.
# (`pactl list short sinks | grep bluez` sur l'hôte pour la relever.)
pcm.mixette {
    type pulse
    device "bluez_output.AC:80:0A:7F:3C:53"
}
ctl.mixette { type pulse }

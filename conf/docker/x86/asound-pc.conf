# Alias ALSA du banc PC — monté par docker-compose-x86.yml sur
# /etc/asound.conf DU CONTENEUR (l'hôte n'est jamais modifié).
#
# Mêmes NOMS d'alias que sur le Pi 5 (casque_mic / mixette, cf.
# vision_config.py chat_mic_device/chat_out_device) : le code de prod tourne
# sans qu'aucun paramètre ne change — seule la cible diffère, la carte du PC.
#
# Cible = Scarlett 4i4 (ID ALSA « USB », adressage PAR NOM de carte, jamais
# par numéro : les numéros bougent au branchement — leçon du Pi 5). C'est la
# carte du pupitre voix (SM58, essais/voix) : micro ET sortie au même endroit.
#
# type plug et pas hw : le chat capture en S16_LE 16 kHz mono
# (vision/audio/mic.py) et la Scarlett ne descend pas sous 44,1 kHz —
# plug fait les conversions de format/fréquence/canaux.
#
# ⚠️ Si arecord/aplay répondent « Device or resource busy » : PipeWire tient
# la carte côté hôte. Libérer la Scarlett (fermer les applis qui l'utilisent,
# ou `systemctl --user stop wireplumber pipewire` le temps de la séance).
pcm.casque_mic {
    type plug
    slave.pcm "hw:USB"
}
pcm.mixette {
    type plug
    slave.pcm "hw:USB"
}

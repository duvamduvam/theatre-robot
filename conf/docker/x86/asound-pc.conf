# Alias ALSA du banc PC — monté par docker-compose-x86.yml sur
# /etc/asound.conf DU CONTENEUR (l'hôte n'est jamais modifié).
#
# Mêmes NOMS d'alias que sur le Pi 5 (casque_mic / mixette, cf.
# vision_config.py chat_mic_device/chat_out_device) : le code de prod tourne
# sans qu'aucun paramètre ne change — seule la cible diffère.
#
# ⚠️ CIBLE = PIPEWIRE, PAS UNE CARTE (changé le 2026-09-13, David parle dans
# un casque BLUETOOTH « M50 »). Un périphérique Bluetooth n'existe PAS comme
# carte ALSA : il n'est servi que par le démon audio de l'hôte. On passe donc
# par le plugin `type pulse` (paquet libasound2-plugins, cf.
# conf/packages-docker.txt) et la socket PipeWire montée par le compose
# (PULSE_SERVER). Aucun `hw:` ici : ce serait un cul-de-sac pour le BT.
#
# Corollaire : c'est PipeWire qui choisit le profil du casque. Ouvrir le micro
# bascule le M50 en HFP (mono ~16 kHz, la sortie devient téléphonique le temps
# de l'écoute) — normal en Bluetooth mains-libres, suffisant pour whisper.
#
# Le nom de nœud porte l'ADRESSE MAC du casque : à changer si l'on bancise un
# autre appareil (`pactl list short sources | grep bluez` sur l'hôte).
# Laisser `device` vide ferait suivre le défaut PipeWire du bureau — refusé
# ici : une séance de mesure ne doit pas changer de micro parce que quelqu'un
# a branché un casque ailleurs.
pcm.casque_mic {
    type pulse
    device "bluez_input.40:9C:A7:5B:66:D6"
}
pcm.mixette {
    type pulse
    device "bluez_output.40:9C:A7:5B:66:D6"
}

# Le plugin pulse exige aussi un CTL du même nom pour certains outils
# (arecord/aplay interrogent le contrôle de mixage) : sans ça, `arecord -D
# casque_mic` fonctionne mais `amixer -D casque_mic` échoue bruyamment.
ctl.casque_mic { type pulse }
ctl.mixette { type pulse }

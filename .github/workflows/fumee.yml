# Fumée de LOGIQUE sur un runner GitHub gratuit, à chaque PR vers main (lot F2, 28/11/2026).
#
# Pourquoi la famille « logique » seulement : les runners publics (4 vCPU, 16 Go, aucun GPU :
# Gazebo, ses caméras et le lidar simulé rendus par le CPU, sous Xvfb) tournent à RTF 0,68-0,76,
# sous le seuil de 0,8 ; la sonde rtf arrêtait tout, aucune épreuve n'était jouée (28/11). Le
# programme F1 (machines/sim/fumee/) joue donc ici `--famille logique` : les épreuves qui ne
# dépendent ni de l'horloge simulée ni de la conduite (namespace, catalogue, parle, machines,
# audio ; plan.toml), SANS la sonde rtf. Les épreuves de COMPORTEMENT (edition, corps_sur,
# chantiers, a1, objets, conversation) restent sur le PC (fumée de référence).
# Compte rendu : docs/operations.md § « Fumée automatique », docs/spec-F1-programme-fumee.md.
#
# Lancement : automatique sur toute PR vers main et tout push sur main, sauf doc seule ; à la
# main : gh workflow run fumee.yml --ref <branche> [-f ref=<sha ou branche à tester>]
#
# Adaptations du runner, toutes explicites par variable (le programme garde ses défauts du PC) :
#   FUMEE_DEPOT=$GITHUB_WORKSPACE, tous les chemins (arbre de travail compris) sous $RUNNER_TEMP/fumee/ ;
#   FUMEE_COEURS=        pas de réservation de cœurs (4 vCPU, rien d'autre ne tourne) ;
#   FUMEE_SIM_OCCUPEE    verrou « sim occupée » propre au runner (aucune séance de David ici) ;
#   FUMEE_PROFIL=0 et --profil aucun : pas de profil d'énergie (pas de power-profiles-daemon) ;
#   FUMEE_COMMIT=0       aucun commit depuis la CI (et FUMEE_SORTIE hors du dépôt) ;
#   FUMEE_BUILD_ARGS     frontend Dockerfile « labs » (COPY --exclude), Docker du runner plus ancien ;
#   FUMEE_DELAI_DEMARRAGE=1200  colcon ×4 sur 4 vCPU est plus lent que sur le PC ;
#   DISPLAY=:99          Xvfb lancé sur l'hôte du runner (le compose monte /tmp/.X11-unix) ;
#   DIDIER_MEDIAS_PRIVES dossier VIDE (les audios privés ne quittent pas le PC).
# Sans `sensors`, le thermomètre est absent : gardien de chaleur muet (banc sain), comme prévu.
#
# Secrets ANTHROPIC / OPENROUTER : plus aucune épreuve ne les consomme ici (la conversation est
# sur le PC, le compose de base n'en monte aucun) ; ils ne sont plus posés. Leurs valeurs servent
# SEULEMENT à fouiller les artefacts avant publication ; jamais lues dans un journal, jamais affichées.
name: fumee

on:
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche, tag ou sha à tester (vide = la branche choisie au lancement)"
        required: false
        default: ""

permissions:
  contents: read

# Une seule passe par ref : une nouvelle poussée annule la passe en cours.
concurrency:
  group: fumee-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fumee:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Le programme fait `git fetch origin` puis un worktree de la révision : historique complet.
          fetch-depth: 0

      - name: Chemins de la passe (sous RUNNER_TEMP)
        run: |
          R="$RUNNER_TEMP/fumee"
          mkdir -p "$R"/{etat,brut,pages,sim,medias-prives/audios,tmp}
          : >"$R/xauthority"
          {
            echo "FUMEE_R=$R"
            echo "FUMEE_DEPOT=$GITHUB_WORKSPACE"
            echo "FUMEE_ARBRE=$R/arbre"
            echo "FUMEE_ETAT=$R/etat"
            echo "FUMEE_BRUT=$R/brut"
            echo "FUMEE_SORTIE=$R/pages"
            echo "DIDIER_SIM_JOURNAUX=$R/sim"
            echo "FUMEE_SIM_OCCUPEE=$R/sim-occupee"
            echo "DIDIER_MEDIAS_PRIVES=$R/medias-prives"
            echo "TMPDIR=$R/tmp"
            echo "FUMEE_COEURS="
            echo "FUMEE_PROFIL=0"
            echo "FUMEE_COMMIT=0"
            echo "FUMEE_BUILD_ARGS=--build-arg BUILDKIT_SYNTAX=docker/dockerfile:1-labs"
            echo "FUMEE_DELAI_DEMARRAGE=1200"
            echo "DISPLAY=:99"
            echo "XAUTHORITY=$R/xauthority"
          } >>"$GITHUB_ENV"
          # La révision testée : le commit extrait (pour une PR, son commit de fusion avec main).
          echo "FUMEE_REV=$(git rev-parse HEAD)" >>"$GITHUB_ENV"

      - name: Libérer le disque (4 images ≈ 11 Go)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null || true
          df -h /

      - name: Écran virtuel (Xvfb :99) et /dev/dri vide
        run: |
          # Le compose monte /dev/dri sur `monde` (GPU du PC) : absent ici, Docker refuserait le
          # montage. Un dossier vide suffit ; Mesa rend alors en logiciel (llvmpipe).
          sudo mkdir -p /dev/dri
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          # -ac : pas de contrôle d'accès (VM jetable) — le fichier XAUTHORITY vide suffit au compose.
          nohup Xvfb :99 -screen 0 1280x1024x24 -ac +extension GLX +render -noreset >"$FUMEE_R/xvfb.log" 2>&1 &
          sleep 3
          test -S /tmp/.X11-unix/X99 && echo "Xvfb :99 prêt"
          nproc; free -g; python3 --version

      # Les 4 images sont construites par l'épreuve « image » du programme (étiquette d'empreinte,
      # FUMEE_BUILD_ARGS) : pas d'étape de build à part, qui construirait deux fois.
      - name: Fumée de logique (programme F1, sans porte rtf)
        id: fumee
        timeout-minutes: 90
        working-directory: machines/sim
        run: |
          set +e
          python3 -u -m fumee --rev "$FUMEE_REV" --famille logique --profil aucun
          rc=$?
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          echo "le programme de fumée a rendu le code $rc (0 vert, 1 rouge, 2 refus, 3 invalide)"

      - name: Résumé (verdict par épreuve)
        if: always()
        run: |
          res="$(ls -t "$FUMEE_R"/brut/*/resultat.json 2>/dev/null | head -1)"
          if [ -z "$res" ]; then echo "aucun resultat.json (refus ou échec avant la fumée : voir le journal)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          python3 - "$res" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          r = json.load(open(sys.argv[1]))
          print("## Fumée de logique sur GitHub Actions : %s" % r.get("verdict"))
          print()
          rtf = "non exigé (famille %s)" % r["famille"] if r.get("famille") else "**%s** (seuil %s)" % (r.get("rtf"), r.get("rtf_min"))
          print("RTF %s · %s min · sha %s · %s cœurs" % (
              rtf, round((r.get("duree_s") or 0) / 60), r.get("sha"), r.get("nb_coeurs")))
          print()
          print("| épreuve | statut | ok/attendu | durée (s) | détail |")
          print("|---|---|---|---|---|")
          for e in r.get("epreuves", []):
              compte = "%s/%s" % (e.get("ok"), e.get("attendu")) if e.get("attendu") is not None else (e.get("obtenu") or "")
              print("| %s | %s | %s | %s | %s |" % (e.get("id"), e.get("statut"), compte, e.get("duree_s", ""),
                                                   str(e.get("detail") or "").replace("|", "/")[:160]))
          for n in r.get("notes", []):
              print("- note : " + str(n).replace("|", "/")[:300])
          PY

      - name: Effacer les secrets et fouiller les artefacts
        if: always()
        env:
          CLE_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          CLE_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Rien ne les pose plus ; on efface quand même (VM réutilisée par erreur, ancienne étape).
          rm -f "$HOME/.config/didier/secrets.env" "$HOME/.config/didier/vision-conf-secret"
          A="$FUMEE_R/artefact"; mkdir -p "$A"
          cp -r "$FUMEE_R/pages" "$FUMEE_R/brut" "$A/" 2>/dev/null || true
          cp "$FUMEE_R/xvfb.log" "$A/" 2>/dev/null || true
          cp "$FUMEE_R/etat/journal.log" "$A/journal-fumee.log" 2>/dev/null || true
          # Journaux de la sim (écrits root par les conteneurs) : réduits à l'essentiel lisible.
          sudo tar -czf "$A/journaux-sim.tar.gz" -C "$FUMEE_R" sim 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$A"
          trouve=0
          for cle in "$CLE_ANTHROPIC" "$CLE_OPENROUTER"; do
            [ -n "$cle" ] || continue
            if grep -rqF -- "$cle" "$A"; then trouve=1; fi
            for t in $(find "$A" -name '*.tar.gz'); do
              tar -xzOf "$t" 2>/dev/null | grep -qF -- "$cle" && trouve=1
            done
          done
          if [ "$trouve" = 1 ]; then
            echo "::error::une clé apparaît dans les artefacts : rien n'est publié"
            rm -rf "$A"; exit 1
          fi
          du -sh "$A"

      - name: Artefacts (page, resultat.json, journaux bruts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fumee-${{ github.run_id }}
          path: ${{ runner.temp }}/fumee/artefact
          if-no-files-found: warn
          retention-days: 30

      - name: Verdict de la fumée
        if: always()
        run: |
          case "${{ steps.fumee.outputs.rc }}" in
            0) echo "fumée de logique VERTE"; exit 0 ;;
            3) # Un gardien a parlé (registre Docker injoignable, enregistreur mort…) : banc
               # INVALIDE, pas un défaut du code — pas de job en échec, un avertissement le dit.
               echo "::warning::fumée INVALIDE : défaut du banc, pas de Didier — relancer ou juger sur le PC (voir le résumé)"
               exit 0 ;;
            1) echo "::error::fumée ROUGE : voir le résumé (tableau des épreuves)"; exit 1 ;;
            *) echo "::error::fumée non jouée (code ${{ steps.fumee.outputs.rc }} : refus ou échec du banc) : voir le journal"; exit 1 ;;
          esac

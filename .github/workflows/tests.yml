# CI palier 1 du mono-dépôt (11/11/2026, étude docs/etudes/etude-standards-robotique.md §7).
#
# Pourquoi ce fichier : depuis le lot L0 (02/11) les workflows des anciens dépôts vivaient
# sous legacy/*/.github/, où GitHub ne les lit pas — plus aucun test ne tournait à la poussée.
# Celui-ci rejoue, à chaque poussée, les suites unitaires « hôte » (aucun ROS à installer :
# les modules ROS sont factices dans les tests), avec les commandes de docs/operations.
#
# Volontairement minimal : pas de build colcon, pas de sim (la fumée nocturne locale s'en
# charge), pas de cache. Une suite = une ligne de la matrice ; en ajouter une = une ligne.
name: tests

on: [push, pull_request]

jobs:
  unit:
    name: ${{ matrix.suite }}
    # Ubuntu 24.04 + Python 3.12 : le couple de ROS 2 Jazzy et des venv de dev.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: didier_core
            dir: packages/didier_core
            requirements: legacy/dadou_robot_ros/requirements-test.txt
          - suite: dadou_utils_ros
            dir: packages/dadou_utils_ros
            requirements: legacy/dadou_robot_ros/requirements-test.txt
          - suite: didier_jeu
            dir: packages/didier_jeu
            requirements: legacy/dadou_robot_ros/requirements-test.txt
          - suite: theatre_contrats
            dir: packages/theatre_contrats
            requirements: legacy/dadou_robot_ros/requirements-test.txt
          - suite: didier_vision
            dir: packages/didier_vision
            requirements: legacy/dadou_vision_ros/requirements-test.txt
          - suite: telecommande (legacy)
            dir: legacy/dadou_control_ros
            requirements: legacy/dadou_control_ros/requirements-test.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ${{ matrix.requirements }}
      # « -o addopts= » : la commande exacte de la doc (neutralise le -q des pytest.ini
      # pour que le compte de tests apparaisse dans le journal).
      - run: python -m pytest -q -o addopts=
        working-directory: ${{ matrix.dir }}

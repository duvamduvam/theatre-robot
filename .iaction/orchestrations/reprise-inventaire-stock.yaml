name: reprise-inventaire-stock
description: >-
  Reprend l'inventaire du stock : relit les zones d'ombre sur les images déjà
  extraites, affine le fichier, commite. Ne commande rien.
inputs:
  - name: consigne
    label: "Consigne particulière pour cette reprise (facultatif)"
    # Un default est OBLIGATOIRE : sans lui, l'input est requis et une tâche
    # planifiée échouerait au lancement, faute de quelqu'un pour le saisir.
    default: ""
steps:
  - id: relecture
    agent: inventoriste
    task: |
      Relis `docs/hardware/inventaire-stock.md`, en particulier sa section 3
      « Zones d'ombre ». Pour chaque point de priorité 2 (ceux qui NE demandent
      PAS une manipulation physique de David — typiquement : relire une
      sérigraphie, un tableau, une étiquette), retourne aux images concernées
      dans `docs/pictures/stock/frames_all/` et `best/`, en t'aidant du fait
      qu'une même scène s'étale sur plusieurs secondes : la frame retenue dans
      `best/` n'est pas forcément la plus lisible pour UN détail donné, une
      voisine dans `frames_all/` peut l'être. Recadre et zoome si besoin.

      Rends la liste des identifications que tu as pu affiner, et celles qui
      restent hors de portée de l'image (elles resteront pour David).

      Consigne particulière de cette reprise : {{consigne}}
  - id: mise-a-jour
    agent: inventoriste
    needs: [relecture]
    task: |
      Applique ces affinages à `docs/hardware/inventaire-stock.md` : corrige les
      lignes concernées, retire de la section 3 ce qui est levé, et laisse en
      tête ce que seul David peut trancher physiquement.

      Si la nomenclature d'un chantier est touchée (odométrie en premier lieu),
      mets à jour la confrontation en §1.1 et le renvoi dans l'étude concernée.
      Mets `docs/chantiers.md` en cohérence.

      Puis commite (message détaillé : le quoi ET le pourquoi). Si rien n'a pu
      être affiné, ne commite pas et dis-le franchement — un commit vide coûte
      plus qu'il ne rapporte.

      Résultat de la relecture : {{steps.relecture.output}}
limits:
  maxParallel: 1
  maxDurationMin: 40

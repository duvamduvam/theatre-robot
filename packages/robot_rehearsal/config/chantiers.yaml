  - [10.0, 0.0]
  - [20.0, 0.0]
  - [30.0, 0.0]
  - [40.0, 0.0]
  - [50.0, 0.0]
  - [60.0, 0.0]
  - [70.0, 0.0]
  - [77.44, 5.21]
  - [84.88, 10.42]
  - [92.31, 15.62]
  - [99.75, 20.83]
  - [107.19, 26.04]
  - [114.63, 31.25]
  - [122.07, 36.46]
  - [129.5, 41.66]
  - [136.94, 46.87]
  - [144.38, 52.08]

# Itinéraire « chantiers » (lot R3, étude §13.2-13.3) : des Nefs à la grue
# Titan grise, Loire à DROITE (y < 0), bâtiments à GAUCHE (y > 0).
# Ordre des POI = ordre RÉEL de la marche (Nefs -> Mail des Chantiers -> quai
# des Antilles -> pointe ouest).
#
# POSITIONS RECALÉES sur le monde didier_sim/worlds/chantiers.sdf (lot monde) :
# - polyligne en 18 points tous les 8-10 m : le Mail le long de +x (y = 0) de
#   (2, 0) à la COUDÉE (70, 0), puis le quai à +35° (vers y positif, côté
#   bâtiments ; la Loire reste à y négatif) jusqu'à (144.38, 52.08), au pied
#   de la Titan (158,8 m de tracé) ;
# - chaque POI est l'ANCRE de son modèle SDF (même x, y) : un point de
#   déclenchement à 1,4-2 m du tracé, alors que l'objet lui-même est décalé
#   dans le repère du modèle (2 à 7 m du tracé, jamais à moins de 1,5 m) ;
# - RÈGLE GRAVÉE (test_chantiers_world.py) : PoiWatcher exige d < rayon, donc
#   distance(centre, tracé) <= rayon - 1 m, sinon un Didier qui suit la
#   polyligne ne déclencherait jamais l'enter ; centres consécutifs à >= 4,5 m
#   (en x ET le long du tracé), la Titan à 8 m de son prédécesseur.
# Toute retouche d'une position se répercute dans le SDF ET dans le test.
#
# Champs : `lubie` = consigne envoyée TELLE QUELLE au chat par le régisseur
# (type de panne `lubie` sans `text`) ; `fermeture` = indice de mise en scène,
# lu par PERSONNE en machine (David au débrief, l'écriture). Textes = brouillons
# d'atelier, à valider par David. Lot M1 « aller voir » (spec-aller-voir.md
# §2.1) : `desc` = ce qu'on VOIT (6 mots au plus, envoyé à chat_node dans
# rehearsal/objects) ; `alias` = mots que David peut dire pour désigner
# l'objet (correspondance normalisée : minuscules, sans accents ni article
# de tête). Un mot ne désigne qu'UN objet (refus au chargement) : jamais de
# « hangar » ni de « grue » seuls, partagés par deux POI. Brouillons, à
# valider par David. Les noms sont un CONTRAT : ids `lubie_<poi>`
# de scenarios/chantiers.yaml, modèles de chantiers.sdf, test_rehearsal_contract.py.
name: nefs-titan-grise
waypoints:

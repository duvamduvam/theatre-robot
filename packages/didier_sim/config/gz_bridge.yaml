# Bridge ros_gz : correspondance topics ROS 2 <-> Gazebo (Harmonic).
# Les noms côté gz sont fixés par les plugins déclarés dans
# didier_description/urdf/dadou_robot_gz.urdf.xacro.
#
# Namespace (lot L1b) : côté ROS, les noms sont RELATIFS — le parameter_bridge
# est lancé dans le groupe PushRosNamespace de sim.launch.py, rclcpp les étend
# donc en /<ROBOT_NAME>/… (/didier/cmd_vel). DEUX exceptions, gravées par
# robot/tests/unit/test_namespace_contract.py, globales PAR CONSTRUCTION ROS :
#   /clock : TimeSource (rclcpp/rclpy) de TOUT nœud use_sim_time s'abonne à
#            /clock ABSOLU — namespacé, l'horloge simulée n'arriverait plus ;
#   /tf    : TransformBroadcaster/Listener parlent /tf absolu (comme /tf_static).
# Les gz_topic_name ne changent PAS : le monde gz ignore les namespaces ROS.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Interface standard des roues — le coeur de la Phase 2.
- ros_topic_name: "cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Vérité terrain (plugin OdometryPublisher du xacro, SIM-ONLY) : la pose
# VRAIE de Didier dans le monde, pour le cheminement de la salle de
# répétition (didier_rehearsal). /odom ci-dessus reste l'odométrie « comme
# en vrai » (intégration des roues) — les deux coexistent volontairement.
- ros_topic_name: "ground_truth/odom"
  gz_topic_name: "/ground_truth/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# TF odom -> base_link publié par le plugin DiffDrive.
- ros_topic_name: "/tf"
  gz_topic_name: "/tf_gz"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Servos : cible de position en radians (mêmes noms que les servos du code).
- ros_topic_name: "neck/position"
  gz_topic_name: "/neck/position"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "left_arm/position"
  gz_topic_name: "/left_arm/position"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "right_arm/position"
  gz_topic_name: "/right_arm/position"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "left_eye/position"
  gz_topic_name: "/left_eye/position"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "right_eye/position"
  gz_topic_name: "/right_eye/position"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# Caméra embarquée (SIM-ONLY, retour vidéo du pont web) : le capteur gz
# (dadou_robot_gz.urdf.xacro) publie son image sur le topic gz EXPLICITE
# `camera/image_raw` (pas de scope /world/stage/... : on a fixé <topic> dans le
# SDF justement pour éviter ce nom auto-généré). web_bridge_node s'y abonne côté
# ROS (paramètre camera_topic, défaut "camera/image_raw") et l'encode en JPEG.
- ros_topic_name: "camera/image_raw"
  gz_topic_name: "camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Caméra de POURSUITE (SIM-ONLY, « Didier vu de l'extérieur » sur la page scène) :
# derrière et au-dessus du robot, topic gz EXPLICITE comme la caméra embarquée.
# web_bridge_node s'y abonne (paramètre exterior_topic) et l'encode en JPEG.
- ros_topic_name: "camera_ext/image_raw"
  gz_topic_name: "camera_ext/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# LED (leds_sim_node, package didier_sim) : le monde `stage` charge le système
# gz UserCommands, qui expose /world/stage/material_color en écriture. Publier
# dessus change en direct le matériau (diffuse/emissive/ambient) d'un visual
# nommé de la scène -- pas besoin de republier le SDF ni de plugin dédié.
# entity_match=FIRST + entity.name=<link>_visual ciblent un visual précis
# (voir dadou_robot_gz.urdf.xacro : preserveFixedJoint sur les joints LED fixes
# pour garder ce nom stable, sinon la conversion URDF->SDF les fusionne dans
# torso_link_visual).
- ros_topic_name: "material_color"
  gz_topic_name: "/world/stage/material_color"
  ros_type_name: "ros_gz_interfaces/msg/MaterialColor"
  gz_type_name: "gz.msgs.MaterialColor"
  direction: ROS_TO_GZ

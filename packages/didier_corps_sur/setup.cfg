[develop]
script_dir=$base/lib/didier_corps_sur
[install]
install_scripts=$base/lib/didier_corps_sur

# mypy --strict sur tout le package (consigne du 07/11, spec A0 §6.1) :
#   cd packages/didier_corps_sur && mypy didier_corps_sur
# Les messages et rclpy n'existent pas sur le PC (ROS dans les conteneurs seulement) : ignorés,
# et le nœud a le droit d'hériter de rclpy.node.Node (typé Any ici).
[mypy]
strict = True
mypy_path = ../theatre_contrats

[mypy-rclpy.*,diagnostic_msgs.*,geometry_msgs.*,rosidl_runtime_py.*,theatre_interfaces.*]
ignore_missing_imports = True

[mypy-didier_corps_sur.corps_sur_node]
disallow_subclassing_any = False
